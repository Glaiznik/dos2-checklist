<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOS2 Tactician Checklist</title>
<style>
:root{
  --bg:#edf0ee; --panel:#e2e7e4; --card:#f8faf9; --ink:#17222b; --mute:#5d6b73; --line:#cbd3cf;
  --source:#0d7f82; --source-soft:#d3ebe9; --fight:#a3303b; --event:#7a5a12; --explore:#3f6f33; --note:#5d6b73;
  --gold:#9a6a12; --warn-bg:#f4ead2; --solo-bg:#dfe6f3; --solo-ink:#2c4a86;
  --serif:"Iowan Old Style","Palatino","Charter",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f171d; --panel:#141f27; --card:#19262f; --ink:#e2e8e5; --mute:#8fa0a6; --line:#2a3a44;
  --source:#44c9c4; --source-soft:#143a3c; --fight:#ee7f86; --event:#e2b85a; --explore:#8cc977; --note:#8fa0a6;
  --gold:#e2b85a; --warn-bg:#3a3118; --solo-bg:#1b2a45; --solo-ink:#9fbaf0; color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0f171d; --panel:#141f27; --card:#19262f; --ink:#e2e8e5; --mute:#8fa0a6; --line:#2a3a44;
  --source:#44c9c4; --source-soft:#143a3c; --fight:#ee7f86; --event:#e2b85a; --explore:#8cc977; --note:#8fa0a6;
  --gold:#e2b85a; --warn-bg:#3a3118; --solo-bg:#1b2a45; --solo-ink:#9fbaf0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);display:grid;grid-template-columns:270px 1fr}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--source);outline-offset:2px}

/* sidebar */
#side{background:var(--panel);border-right:1px solid var(--line);height:100vh;position:sticky;top:0;align-self:start;overflow:auto;padding:22px 14px 18px;display:flex;flex-direction:column;gap:18px}
#side h1{font:600 21px/1.15 var(--serif);margin:0 6px;letter-spacing:.01em}
#side h1 small{display:block;font:400 12.5px var(--sans);color:var(--mute);margin-top:5px}
#total{margin:0 6px}
#total .xp{font:600 26px/1 var(--serif);font-variant-numeric:tabular-nums}
#total .lvl{margin-top:12px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
#total .lvl b{display:block;font:600 19px/1.2 var(--serif);color:var(--ink)}
#total .of{color:var(--mute);font-size:12.5px;margin-top:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--source);border-radius:3px;transition:width .25s}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:12px;color:var(--mute);margin:8px 8px 4px}
nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 9px;border-radius:7px;border-left:3px solid transparent}
nav button:hover{background:var(--card)}
nav button[aria-current=true]{background:var(--card);border-left-color:var(--source)}
nav button .n{font-weight:600;font-size:13.5px}
nav button .c{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;align-self:center}
nav button .bar{grid-column:1/3;height:3px;margin-top:5px}
nav button.done .c{color:var(--source)}
.tools{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px}
.tools button,.tools label{font-size:12.5px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:5px 9px;cursor:pointer}
.tools button:hover,.tools label:hover{background:var(--card)}
.tools input{display:none}
#reset{margin:0 6px;padding:8px 10px;font-size:13px;font-weight:600;border:1px solid var(--fight);color:var(--fight);background:transparent;border-radius:7px;cursor:pointer}
#reset:hover{background:var(--fight);color:var(--bg)}
#saved{font-size:12px;color:var(--mute);margin:0 6px;min-height:1.3em}

/* main */
main{min-width:0;padding:26px 34px 80px;max-width:1020px}
main>h2{font:600 30px/1.15 var(--serif);margin:0 0 4px}
.sub{color:var(--mute);font-size:13.5px;margin-bottom:16px;font-variant-numeric:tabular-nums}
.brief{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.brief b{color:var(--source);font-weight:600}
.brief span{grid-column:2}
#filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--line);margin-bottom:6px}
#filters input[type=search]{flex:1 1 200px;min-width:160px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none;background:transparent}
.chip input{accent-color:var(--source);margin:0}
#filters select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card)}

section.sec{margin-top:18px}
.sec>header{display:flex;align-items:baseline;gap:12px;cursor:pointer;padding:6px 0;border-bottom:2px solid var(--ink)}
.sec>header h3{font:600 17px var(--serif);margin:0;flex:1}
.sec>header .c{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.sec>header .tw{font-size:11px;color:var(--mute);width:1em;transition:transform .15s}
.sec.shut>header .tw{transform:rotate(-90deg)}
.sec.shut .body{display:none}
.sec.alldone>header h3{color:var(--mute)}
.zone{font-size:12.5px;color:var(--mute);margin:12px 0 2px 34px;font-weight:600}
.row{display:grid;grid-template-columns:26px 62px 1fr auto;gap:0 8px;padding:6px 6px 6px 0;border-bottom:1px solid var(--line);align-items:start}
.row:hover{background:var(--card)}
.row input{width:17px;height:17px;margin:2px 0 0 4px;accent-color:var(--source);cursor:pointer}
.row .ty{font-size:12px;font-weight:600;padding-top:2px}
.ty.F{color:var(--fight)}.ty.E{color:var(--event)}.ty.X{color:var(--explore)}.ty.N{color:var(--note);font-style:italic}.ty.S{color:var(--mute);font-weight:400}
.row .tx{min-width:0;overflow-wrap:anywhere}
.row.N .tx{color:var(--mute);font-style:italic}
.row .tx ul{margin:2px 0 0;padding:0;list-style:none;color:var(--mute);font-size:13.5px}
.row .meta{text-align:right;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.row .meta b{display:block;color:var(--gold);font-weight:600;font-size:13.5px}
.row .ref{display:inline-block;font-size:11.5px;border:1px solid var(--fight);color:var(--fight);border-radius:4px;padding:0 5px;margin-left:6px;cursor:pointer;background:transparent}
.row.done .tx,.row.done .ty,.row.done .meta b{opacity:.45}
.row.done .tx>span{text-decoration:line-through;text-decoration-color:var(--mute)}
.tag{display:block;margin-top:5px;font-size:13px;padding:5px 9px;border-radius:6px;font-style:normal}
.tag.later{background:var(--warn-bg)}
.tag.solo{background:var(--solo-bg);color:var(--solo-ink)}
.tag b{font-weight:600}
.tag.kind{background:transparent;border:1px dashed var(--fight);color:var(--fight)}
#route{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 6px}
#route .grp{grid-column:1/3;font-size:12px;color:var(--mute);margin-bottom:2px}
#route button{font-size:12.5px;line-height:1.25;padding:7px 6px;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}
#route button[aria-pressed=true]{background:var(--source);border-color:var(--source);color:var(--bg);font-weight:600}
.empty{color:var(--mute);padding:30px 0}

/* info pages */
.doc h3{font:600 19px var(--serif);margin:26px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.doc p{margin:3px 0;max-width:86ch}
.doc .tw{overflow-x:auto;margin:10px 0}
.doc table{border-collapse:collapse;font-size:13.5px}
.doc th,.doc td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top;white-space:pre-line}
.doc th{background:var(--panel)}
.doc mark{background:var(--source-soft);color:inherit}

@media (max-width:760px){
  body{display:block}
  #side{position:static;height:auto}
  main{padding:18px 14px 60px}
  .row{grid-template-columns:26px 1fr auto}
  .row .ty{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#next{margin:12px 0 0;width:100%;padding:8px 10px;font-size:13px;font-weight:600;border:1px solid var(--source);color:var(--source);background:transparent;border-radius:7px;cursor:pointer;text-align:left}
#next:hover{background:var(--source);color:var(--bg)}
#next small{display:block;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#total .today,#total .vend{margin-top:8px;font-size:12.5px;color:var(--mute)}
#slots{margin:0 6px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
#slots .grp{grid-column:1/4;font-size:12px;color:var(--mute);margin-bottom:2px}
#slots select{grid-column:1/4;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);min-width:0}
#slots button{font-size:12px;padding:5px 4px;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer}
#slots button:hover{background:var(--card)}
#slots #reset{grid-column:1/4;margin:2px 0 0}
#route label{grid-column:1/3;font-size:12.5px;display:flex;gap:6px;align-items:flex-start;margin-top:4px;cursor:pointer}
#route label input{accent-color:var(--source);margin-top:2px}
.row{position:relative}
.row .acts{position:absolute;right:118px;top:4px;display:flex;gap:4px;opacity:0;background:var(--card);padding:2px 4px;border-radius:5px;box-shadow:0 0 0 1px var(--line)}
.row:hover .acts,.row .acts:focus-within{opacity:1}
.row .acts button{all:unset;cursor:pointer;font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--mute)}
.row .acts button:hover{color:var(--ink);border-color:var(--ink)}
.row .acts button:focus-visible{outline:2px solid var(--source)}
.row.skipped .tx>span,.row.skipped .ty,.row.skipped .meta b{opacity:.4}
.row.skipped .tx>span{text-decoration:line-through dotted}
.tag.prep{background:transparent;border-left:3px solid var(--fight);border-radius:0;padding:2px 9px}
.tag.check{background:var(--source-soft)}
.tag.check.behind{background:var(--warn-bg)}
.tag.mine{background:transparent;border:1px solid var(--line);white-space:pre-wrap}
.tx textarea{display:block;width:100%;margin-top:5px;min-height:60px;padding:6px 8px;border:1px solid var(--source);border-radius:6px;background:var(--card);font:inherit;font-style:normal;resize:vertical}
.row.flash{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--source-soft)}to{background:transparent}}
#toast{position:fixed;right:22px;bottom:22px;max-width:380px;background:var(--card);border:1px solid var(--source);border-left:5px solid var(--source);border-radius:8px;padding:12px 14px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20}
#toast b{display:block;margin-bottom:3px}
#toast button{margin-top:8px;font-size:12.5px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 10px;cursor:pointer}
.keep h3{font:600 18px var(--serif);margin:24px 0 4px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.keep label{display:grid;grid-template-columns:26px 1fr;gap:0 8px;padding:7px 6px 7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.keep label:hover{background:var(--card)}
.keep input{width:17px;height:17px;margin:2px 0 0 4px;accent-color:var(--source)}
.keep small{display:block;color:var(--mute);font-size:13px}
.keep label.done b,.keep label.done small{opacity:.45;text-decoration:line-through}
.keep b{font-weight:600}

.tag.need{background:var(--warn-bg);border-left:3px solid var(--gold)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.sheet .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.sheet label{font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.sheet input[type=number],.sheet select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:15px;color:var(--ink);width:100%}
.sheet .cks{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px}
.sheet label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13.5px;cursor:pointer}
.sheet label.ck input{accent-color:var(--source)}
.hh{font:600 19px var(--serif);margin:28px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
.hint{color:var(--mute);font-size:13.5px;margin:6px 0 10px;max-width:80ch}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pick div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--mute)}
.pick b{display:block;font:600 21px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.up{display:flex;flex-direction:column}
.up button{all:unset;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:7px 6px;border-bottom:1px solid var(--line);align-items:baseline}
.up button:hover{background:var(--card)}
.up button:focus-visible{outline:2px solid var(--source)}
.up .w{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.up .cs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chip2{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);white-space:nowrap}
.chip2.ok{color:var(--explore);border-color:var(--explore)}
.chip2.bad{color:var(--fight);border-color:var(--fight);font-weight:600}
.chip2.unk{color:var(--mute)}
.quests .sec{margin-top:4px}
.quests .sec>header{border-bottom:1px solid var(--line)}
.quests .sec>header h3{font-size:15.5px}
.quests .sec:not(.shut)>header{border-bottom:2px solid var(--ink)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:14px}
.chart svg{width:100%;height:auto;display:block}

.chip2.f-miss{color:var(--fight);border-color:var(--fight)}
.chip2.f-choice{color:var(--gold);border-color:var(--gold)}
.chip2.f-origin,.chip2.f-mode{color:var(--solo-ink);border-color:var(--solo-ink)}
.chip2.f-story,.chip2.f-any{color:var(--mute)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.tabs button{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--source);border-color:var(--source);color:var(--bg);font-weight:600}
.jrow{display:grid;grid-template-columns:minmax(180px,1.2fr) 130px 2fr;gap:8px;align-items:center;padding:5px 4px;border-bottom:1px solid var(--line)}
.jrow select,.jrow input,.jadd select,.jadd input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);min-width:0}
.jrow.s2 .nm{opacity:.5;text-decoration:line-through}
.jrow.s1 .nm{font-weight:600;color:var(--source)}
.jrow .star{color:var(--mute)}
.jadd{display:flex;gap:8px;flex-wrap:wrap}
.jadd input{flex:1 1 200px}
.jadd button{padding:5px 14px;border:1px solid var(--source);color:var(--source);background:transparent;border-radius:6px;cursor:pointer;font-weight:600}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.sch{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sch h3{font:600 16px var(--serif);margin:0 0 6px;display:flex;justify-content:space-between}
.sch h3 span{font:400 12.5px var(--sans);color:var(--mute)}
.sch label{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;padding:2px 0;cursor:pointer}
.sch label input{accent-color:var(--source);margin-top:3px}
.sch label.done{opacity:.5;text-decoration:line-through}
.rem{margin:4px 0 0;padding-left:20px;font-size:14px}
.rem li{margin:3px 0}

.jrow .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--mute);text-decoration:none}

#party{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin:0 6px}
#party .grp{grid-column:1/4;font-size:12px;color:var(--mute);margin-bottom:2px}
#party button{font-size:12px;line-height:1.25;padding:7px 4px;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer}
#party button[aria-pressed=true]{background:var(--source);border-color:var(--source);color:var(--bg);font-weight:600}
#comps{grid-column:1/4;margin-top:4px}
#compsIn{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px}
#compsIn label{font-size:12.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
#compsIn input{accent-color:var(--source);margin:0}
#compHint{font-size:12px;color:var(--mute);margin:6px 0 0}

#mainL{grid-column:1/4;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px;margin-top:6px}
#mainSel{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-size:13px}

#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#dlg[hidden]{display:none}
#dlg .box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:min(520px,100%);box-shadow:0 12px 40px rgba(0,0,0,.35)}
#dlg p{margin:0 0 12px;font-size:14.5px}
#dlg input,#dlg textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font-size:14px}
#dlg textarea{height:170px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
#dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#dlg button{padding:7px 14px;border:1px solid var(--line);border-radius:7px;background:transparent;cursor:pointer;font-size:13.5px}
#dlg button.pri{background:var(--source);border-color:var(--source);color:var(--bg);font-weight:600}
</style>
</head>
<body>
<aside id="side">
  <h1>Divinity: Original Sin 2<small>Tactician and Honour walkthrough checklist</small></h1>
  <div id="total">
    <div class="xp" id="xpNow">0</div><div class="of" id="xpOf"></div><div class="bar"><i id="xpBar"></i></div>
    <div class="lvl" id="lvl"></div>
    <div class="vend" id="vend"></div>
    <div class="today" id="today"></div>
    <button id="next"></button>
  </div>
  <div id="slots">
    <div class="grp">Playthrough</div>
    <select id="slot" aria-label="Playthrough"></select>
    <button id="sNew" title="Start another playthrough and keep this one">New</button>
    <button id="sRen">Rename</button>
    <button id="sDel">Delete</button>
    <button id="reset" title="Untick everything in this playthrough">Untick everything</button>
  </div>
  <div id="route"><div class="grp">Route</div>
    <button data-m="1" title="Leaves out kills of people and animals who are no threat to you">Fewer needless kills</button>
    <button data-m="0" title="Every step in the original guide">Guide as written</button>
  </div>
  <div id="party"><div class="grp">Party</div><button data-p="1">Solo</button><button data-p="2">Two Lone Wolves</button><button data-p="4">Full party</button>
    <label id="mainL">Main character<select id="mainSel"><option value="">Custom character</option><option>Sebille</option><option>Ifan</option><option>Red Prince</option><option>Lohse</option><option>Beast</option><option>Fane</option></select></label>
    <div id="comps" hidden><div id="compsIn"></div><p id="compHint"></p></div>
  </div>
  <nav id="nav"></nav>
  <div id="saved"></div>
  <div class="tools">
    <button id="exp" title="Save this playthrough to a file">Back up progress</button>
    <label title="Load a playthrough from a backup file">Restore<input type="file" id="imp" accept=".json,application/json"></label>
    <button id="expT" title="Show this playthrough as text you can copy">Copy backup text</button>
    <button id="impT" title="Restore from pasted backup text">Paste backup</button>
    <button id="theme">Light / dark</button>
  </div>
</aside>
<main id="main"></main>
<div id="toast" hidden></div>

ls/?id=1166202484"],["Maliex's Acts 1 and 2 Max XP Guide","Dropbox","https://www.dropbox.com/s/dtwk2kq1kxdbv5i/Divinity%202%20pub.xlsx?dl=0"],["Zemalf's Solo Max XP Playlist (YouTube)","YouTube","https://www.youtube.com/playlist?list=PLvqxe4XbcSiEHQNplUwbKkenqGhPsaLoy"]],"hd":true},{"h":"INTRODUCTION"},{"p":"- This is a step-by-step guide/walkthrough for D:OS2 - Definitive Edition.","l":0},{"p":"- This is a \"completionist\" guide, for players who want to do every quest while maximizing XP gains (though not exactly fully, with respect to XP -- more on this below).","l":0},{"p":"- This guide is intended for Tactician & Honour Modes, and all the included enemy stats reflect this; however, it \"works\" (has been play-tested) in Classic Mode as well.","l":0},{"p":"- Note this guide is slightly spoiler-laden, in that it makes some references to upcoming events -- \"X battle,\" \"Y event,\" etc.","l":0},{"h":"FAQ"},{"p":"Q. Is this guide spoiler-free?","l":0},{"p":"A. No -- although this guide generally refrains from spoiling events, there are lots of comments along the lines of \"Do/don't do X now, since it will cause Y later.\"","l":0},{"p":"In fact, there are spoilers in the answer to the next question, so I recommend coming back after playing the game once (assuming you want to avoid spoilers).","l":0},{"p":"Q. Is this a \"max XP\" guide?","l":0},{"p":"A. This is complicated, but in short: no, but it's a \"max XP-ish\" guide. To elaborate:","l":0},{"p":"1. There's a sense in which max XP guides can't exist for this game, since there exist XP-yielding events which are infinitely farmable:","l":1},{"p":"- In Bloodmoon Island, you can keep entering and exiting combat to farm Bone Crushers (see 5.4).","l":2},{"p":"- After the final boss fight, you can keep fighting Ifan's Soul Wolf for XP (see 8.8).","l":2},{"p":"2. There almost certainly exist events which I failed to include, because I don't know about them:","l":1},{"p":"- Since this guide was compiled by play-testing rather than looking through the game's code, there are most likely some events not included in this guide.","l":2},{"p":"- If you know of or find any information not included in this guide, please consider letting me know using my contact info at the top of the page.","l":2},{"p":"3. Perhaps most relevantly, this guide consciously makes two choices which result in suboptimal XP, in exchange for other benefits:","l":1},{"p":"- This guide assumes you will let at least one of the Burning Pigs live, so that you can gain access to Feder.","l":2},{"p":"- This guide assumes you will spare Magister Jonathan, so that you can get the Pride of Pryce dagger (Thievery +1).","l":2},{"p":"If you don't like either of these choices, you can still use this guide -- simply make the alternate choice when it comes up.","l":2},{"p":"For more information on these events, see the section immediately below (\"Alternate Choices for Maximizing XP\")","l":2},{"p":"Q. Why doesn't this guide include [Insert XP-yielding event]?","l":0},{"p":"A. It may be because it results in suboptimal XP in the long run, or simply because I don't know about it.","l":0},{"p":"If you message or e-mail me with any information I've missed, I'll include in the next update -- my contact information is at the top of this page. Thanks!","l":0},{"p":"Q. How can you track XP, when different origin characters have unique XP-yielding events?","l":0},{"p":"A. This guide does include background-specific events -- they're just not included in the XP tally, since I'm not assuming you'll be playing with any specific characters.","l":0},{"p":"I do assume you will have at least one character with [Scholar] Tag, and the relevant events are included in both the guide and the XP tally.","l":0},{"p":"For a full list of background-specific XP events, see \"Background-Specific XP Events\" section below.","l":0},{"p":"Q. What's the maximum XP you can get (without farming exploits)?","l":0},{"p":"A. It depends:","l":0},{"p":"- If you follow this guide, you're guaranteed to get at least 22,453,175 total XP, regardless of your party composition.","l":1},{"p":"- If you play as Lohse as your avatar and include the Red Prince and Ifan as companions, you can get 275,250 extra XP -- for 22,728,425 total XP.","l":1},{"p":"- If you do all of the above but deviate from the guide by killing all the Burning Pigs and killing Jonathan, you can get 21,425 extra XP -- for 22,749,850 total XP.","l":1},{"p":"Q. Can I use this guide for [Insert Purpose]?","l":0},{"p":"A. Feel free to do anything you want, other than monetizing it directly.","l":0},{"p":"Q. Where is the actual guide?","l":0},{"p":"A. You have to click on different tabs at the bottom of this page.","l":0},{"h":"ALTERNATE CHOICES FOR MAXIMIZING XP"},{"t":[["Location","Alternate Choice","Consequence","XP Reward"],["Act 1 - Hollow Marshes","Kill all five pigs after blessing them, instead of letting one escape (+200XP)","Forfeit access to Feder as vendor","200"],["Act 2 - Various Locations","Kill Jonathan in the burning house, rather than spare him (+21225 total XP):","Forfeit Pride of Pryce Dagger","21225"],["","- Kill Jonathan while he's unconscious (13450XP)"],["","- Kill the Voidwoken at Gareth's house (16200XP)"],["","- Get event XP for killing the Voidwoken (2700XP)"],["","- Get quest reward for killing the Voidwoken (13450XP)"],["","- Miss out on Paladins fight at Gareth's house (-10800XP)"],["","- Miss out on Silent Monks at Gareth's house (-100XP)"],["","- Miss out on event XP for killing the Silent Monks (-2700XP)"],["","- Miss out on Gareth's Persuasion event (-8075XP)"],["","- Fight Magister Kari in the Blackpits, instead of Jonathan (-2900XP)"]],"hd":true},{"h":"BACKGROUND-SPECIFIC XP EVENTS"},{"p":"- This guide only assumes you'll have someone with [Scholar] Tag, as far as character backgrounds are concerned.","l":0},{"p":"- The guide also accounts for the fact that you'll get at least 19400XP from some event or another, regardless of whether you have Lohse in your party.","l":0},{"p":"- If you want to truly maximize XP, pick Lohse as your avatar and the Red Prince and Ifan as companions.","l":0},{"t":[["Condition","Location","Description","XP Reward"],["Red Prince as Avatar","Act 1 - Fort Joy","Read Narin's Assassination Contract","150"],["Red Prince in party","Act 2 - Paradise Downs","Get ambushed by House of Shadows Assassins","21600"],["","Act 4 - Ancient Empire Camp","Hatch the egg","134750"],["Sebille as Avatar","Act 1 - Fort Joy","Kill Stingtail (Note: you can do this even after sparing him in dialogue)","600"],["","Act 1 - Hollow Marshes","Persuade Zaleskar OR eat his heart for information about the Master","2400"],["Ifan as Companion","Ending - Lady Vengeance","Talk to Ifan to get him to summon his Soul Wolf, then kill it","72375"],["Ifan in party","Act 1 - Harbour","Fulfill the contract by \"killing\" Alexandar","1500"],["Lohse in party","Act 4 - Adramahlihk's Plane","Snuff out Prudence's Candle","19400"],["","Act 4 - Adramahlihk's Plane","Snuff out the Lizard and Elf Candles","19400"],["","Act 4 - Adramahlihk's Plane","Snuff out all candles (Note: Completing this event will set you back in total XP)","58175"],["","Act 4 - Black House Cellar","Find Jahan imprisoned in Doctor Daeva's cellar","19400"],["Lohse not a companion","Act 4 - Black House","Make a pact with Doctor Daeva","19400"],["[Undead] as Avatar","Prologue - Merryweather","Emerge on the Merryweather Deck unveiled to aggro the Magister Knight","100"],["[Lizard] [Scholar] in party","Act 2 - Stonegarden","[Pet Pal] Talk to Xiuh in Ryker's Mansion (Note: Transformation via Mask will not work)","7725"],["[Scholar] in party","Act 2 - Fields","[Pet Pal] Tell Ferno that he's a phoenix","5400"],["","Act 2 - Stonegarden","[Lizard] Persuade the Thrice-Bound Chest to open for you (Note: Transformation via Mask will work)","3875"],["","Act 2 - Healer's House","Successfully operate on Natalie Bromhead","13450"],["","Act 2 - Various Locations","Read Ornate Hymnal","14450"],["","Act 2 - Vault (Child)","Kill Buttons","1400"],["","Act 2 - Vault (Child)","Persuade the Silent Child to come with you","14450"],["","Act 2 - Vault (Adventurer)","Kill Mor the Trenchmouthed","7225"],["","Act 2 - Vault (Adventurer)","Talk to the Adventurer after killing Mor","36100"],["","Act 2 - Vault (Adventurer)","Kill the Adventurer","14450"],["","Act 2 - Vault (Rajjarima)","Kill Rajjarima","36100"],["","Act 2 - Vault (Rajjarima)","Get quest XP for killing Rajjarima","21675"],["","Act 2 - Vaults","Get quest XP for completing all three vaults","7225"],["","Act 4 - Arx Outskirts","Kill Mael'thaeras and its minions","155200"],["","Act 4 - Arx Outskirts","Get quest XP for freeing the Silent Child","58175"]],"hd":true}]],["Basics",[{"h":"BASIC GAMEPLAY MECHANICS & STRATEGY GUIDE"},{"p":"- This page explains some basic mechanics and lists tips for players struggling with their first Tactician Mode playthrough.","l":0},{"p":"- This is not meant to be comprehensive of any aspect of gameplay; it's instead meant to give players enough information to make Tactician Mode manageable.","l":0},{"p":"- Most of this information is well-known, and some will be obvious to those who've completed a playthrough at any difficulty -- feel free to skip this entire page.","l":0},{"p":"- The distinction between \"Tactics\" and \"Exploits\" here is subjective, so experiment to find out what best suits your playstyle.","l":0},{"p":"World Interaction: [01] Vendor Restocking, [02] Pickpocketing Basics, [03] Pickpocketing Around the Weight Limit, [04] Pickpocketing With Smoke Cloud","l":0},{"p":"Combat Mechanics: [05] Turn Order Mechanics: Initiative Calculation, [06] Turn Order Mechanics: Joining & Leaving Combat, [07] Delay Turn Function","l":0},{"p":"Combat Strategy: [08] AP Management: Gaining AP, [09] AP Management: Saving AP","l":0},{"p":"Tactics: [10] Stacking Enemies, [11] Adrenaline + Skin Graft Combo, [12] Torturer + Worm Tremor Combo, [13] Haste Passing, [14] Making Use of Elemental Affinity Talent, [15] Making Use of Ambidextrous Talent","l":0},{"p":"Exploits: [16] Throwing Explosive Traps From Outside Combat, [17] Soul Mate + Healing Potion Combo, [18] Buff Stacking Before Battle","l":0},{"h":"[01] VENDOR RESTOCKING"},{"p":"- For the purposes of this guide, a vendor is any NPC with a restocking inventory totalling some (not insignificant) amount in gold.","l":0},{"p":"- They are usually marked \"Trader,\" but not always; as some don't even invite you to trade (e.g., Lady Kemm), the only way to check is to bring up their inventory via Trade window.","l":0},{"p":"- These NPCs restock their inventory every hour of playtime, or whenever you level up -- whichever happens first -- so you can keep revisiting them to buy or steal items.","l":0},{"p":"- The actual restocking happens only after you bring up their inventory; keep this in mind when you're killing vendors for loot.","l":0},{"p":"- Vendors will upgrade their stock as the player avatar levels up. Some important breakpoints:","l":0},{"p":"1. At Player Level 4, vendors will start stocking a new tier of skillbooks (Level 2 skillbooks).","l":1},{"p":"2. At Player Level 6, vendors will start stocking Epic quality items.","l":1},{"p":"3. At Player Level 9, vendors will start stocking Legendary quality items and possibly a new tier of skillbooks (more Level 2 skillbooks, plus a Source skill).","l":1},{"p":"4. Upon arriving in Act 2, you can pickpocket Hannag for 1-and 2-point Source Skills from every school, regardless of your level.","l":1},{"p":"5. At Player Level 13, vendors will start stocking a new tier of skillbooks (an additional Source skill).","l":1},{"p":"6. At Player Level 16, vendors will start stocking Divine quality items and the final tier of skillbooks (Level 3 skillbooks, plus a final Source skill).","l":1},{"p":"- See the Reference Sheet for a comprehensive list of vendors and vendor upgrades.","l":0},{"h":"[02] PICKPOCKETING BASICS"},{"p":"- Pickpocketing is by far the easiest and most reliable way to gear a full party with properly leveled items, for two reasons:","l":0},{"p":"1. NPC vendors constantly restock gear to match your current level -- and there are plenty of them, in every act.","l":1},{"p":"2. Pickpocketing (even quite early in the game) lets you steal items totalling up to tens of thousands in gold, to the point that gold stops being a consideration altogether.","l":1},{"p":"- Some points of note:","l":0},{"p":"1. Each character can pickpocket a given NPC exactly once. This isn't much of an issue, as more than a dozen companions are available for hire after Act 1.","l":1},{"p":"2. As pickpocketing as a crime, getting caught will turn nearby NPCs hostile.","l":1},{"p":"- Follow these steps to pickpocket without getting caught:","l":0},{"p":"1. Enter conversation with the NPC(s) you want to steal from; this will \"freeze\" them, so that they don't walk off or interrupt while your other character is engaged in pickpocketing.","l":1},{"p":"2. Use your other characters to similarly distract any nearby NPCs, approaching them from the opposite direction so that they're turned away from your would-be target.","l":1},{"p":"3. With your pickpocketing character, enter sneak mode or hold [SHIFT] to confirm you will not be interrupted by any wandering NPCs.","l":1},{"p":"4. Pickpocket your target when ready, taking the time to make sure you don't go over the weight or value limit.","l":1},{"p":"5. Run or waypoint away from the area as soon as you exit dialogue with your victim, as they will start looking for the culprit after a few seconds.","l":1},{"p":"- In the following screenshots, three NPCs who are otherwise protected by one another's vision are turned around, so that a fourth character can freely steal from them:","l":0},{"h":"[03] PICKPOCKETING AROUND THE WEIGHT LIMIT"},{"p":"- As you gain points in Thievery, you will likely start running into the pickpocketing weight limit far before reaching the value limit.","l":0},{"p":"- This is because the pickpocketing weight limit increases linearly (+2kg per level), whereas the value limit increases exponentially (about +50% per level).","l":0},{"p":"- For reference, at Thievery 11 you can steal items totalling 57,700g in value -- but only 22kg in weight.","l":0},{"p":"- You can get around this problem by buying out a vendor's inventory, then simply pickpocketing back the (weightless) gold:","l":0},{"p":"1. Prepare a high-Bartering character, alongside your high-Thievery (i.e. pickpocketing) character.","l":1},{"p":"2. Know exactly how much (in value) you can steal, given your current Thievery level. (See the Reference Sheet.)","l":1},{"p":"3. Open up the Trade window with your would-be target, then bribe them (give them free gold) until you reach max disposition.","l":1},{"p":"4. Buy out their most valuable items, but spend no more gold than you're able to steal back.","l":1},{"p":"5. Complete the trade and steal back the gold via pickpocketing.","l":1},{"h":"[04] PICKPOCKETING WITH SMOKE CLOUD"},{"p":"- Starting in Act 2, you will encounter vendors in well-populated areas, where distracting every nearby NPC is infeasible or downright impossible.","l":0},{"p":"- You can craft and use the Smoke Cover skill (AER1 SCO1) to get around this problem:","l":0},{"p":"1. Walk up behind your target and cast Smoke Cover to block nearby NPCs' vision.","l":1},{"p":"2. Immediately enter sneak mode and pickpocket the target.","l":1},{"p":"3. This will give you about five seconds of uninterrupted pickpocketing -- just enough to steal a couple of items, but not to peruse through the vendor's inventory.","l":1},{"p":"- In the screenshots below, note that the vendor's stock has been bought out beforehand (so that the gold can be pickpocketed back with one quick action):","l":0},{"p":"- If you need more time to go through a vendor's inventory, one option is to Bless the Smoke Cloud after creating it; this will give you about 30 seconds.","l":0},{"p":"- Be careful about doing this near Magisters, however, as casting any Source skill will turn them hostile.","l":0},{"h":"[05] TURN ORDER MECHANICS: INITIATIVE CALCULATION"},{"p":"- Turn order in combat is (or at least appears to be) determined as follows:","l":0},{"p":"1. The character with the highest Initiative goes first.","l":1},{"p":"2. The parties then take alternating turns, with characters within each party acting in the order of their Initiative.","l":1},{"p":"3. If one party runs out of characters, the other party's remaining members (if any) all act, continuing in the order of their Initiative.","l":1},{"p":"4. Whenever there is a tie, a character is selected at random from the pool of the tied characters.","l":1},{"p":"- In the screenshot below, the Player party engages a Voidwoken party in battle:","l":0},{"p":"1. The Player party has four characters: Fane (INI 13), The Red Prince (INI 12), Ifan (INI 11), and Sebille (INI 11).","l":1},{"p":"2. The Voidwoken party has two characters: Viscous Voidling (INI 10), Viscous Voidling (INI 10).","l":1},{"p":"3. The first to act is Fane, since he has the highest Initiative (13).","l":1},{"p":"4. One of the Voidwoken (chosen randomly) will act next; even though it has the lowest Initiative (10) out of everyone, it gets to act simply because the parties alternate turns.","l":1},{"p":"5. The Red Prince will act next, as he has the highest Initiative (12) out of all the remaining characters on the Player party.","l":1},{"p":"6. The remaining Voidwoken will act next, as it's the only remaining member on the Voidwoken party.","l":1},{"p":"7. One of the remaining members on the player party will act next (both INI 11); in this case Ifan is chosen randomly.","l":1},{"p":"8. As there is no member on the Voidwoken side, Sebille will act immediately after Ifan.","l":1},{"p":"- When there are 3 parties involved in battle, turn order depends on the specific fight.","l":0},{"p":"- In some fights (as in the Advocate Voidwoken fight), the third party joins the fight as if they're part of the player party, meaning they'll compete with player characters for turn order.","l":0},{"p":"- In some other fights, they'll join the fight as a separate party; in this case turn order works in much the same way, just with three parties alternating turns, not two.","l":0},{"p":"1. In the screenshot below, the Player party engages a Magister party in battle, with a Townsfolk party joining the fight.","l":1},{"p":"2. The quickest members in each party are: Sebille (Initiative 43); Magister Bela (Initiative 19); Tillya Snook (Initiative 12).","l":1},{"p":"3. Therefore, Sebille will act first; then Magister Bela; then Tillya Snook.","l":1},{"p":"4. The parties will then take alternating turns, preserving the same party order (Player > Magister > Townsfolk > ...).","l":1},{"p":"- A few points of note:","l":0},{"p":"1. Turn order is recalculated at the beginning of each round, meaning any changes in Initiative during combat will be reflected starting in the next round.","l":1},{"p":"2. This \"recalculation\" does not reshuffle tied characters within a party; if two characters in a party have the same Initiative, their order will stay the same, barring stat changes.","l":1},{"p":"3. Though the turn order bar periodically updates, it's not always current; keep in mind that it's not a completely reliable indicator of what will happen in the next round.","l":1},{"p":"4. In fights with 3 parties, Turn order will sometimes behave strangely (with characters from the same party inexplicably acting in succession); it's not known what causes this.","l":1},{"h":"[06] TURN ORDER MECHANICS: JOINING & LEAVING COMBAT"},{"p":"- As noted previously, turn order (once set) doesn't change within a given round.","l":0},{"p":"- There are two exceptions to this:","l":0},{"p":"1. A character leaves the fight.","l":1},{"p":"2. A character joins the fight.","l":1},{"p":"- If a character leaves the fight -- either by dying or escaping combat -- it's simply removed from the existing turn queue, leaving the order of the other characters intact.","l":0},{"p":"- If a character joins the fight, its placement in the queue will depend on how it joins the fight:","l":0},{"p":"1. If it simply walks into a battle already in progress, it will be added at the end of the existing queue and act after everybody else.","l":1},{"p":"2. If it is summoned into the fight, it will be placed either immediately after the character who summoned it or at the end of the queue, depending on the kind of the summon.","l":1},{"p":"3. The vast majority of summons (including all summons by the player) count as \"regular\" summons; the summoned character will act immediately after its summoner.","l":1},{"p":"4. A few other kinds of summons, invariably part of scripted events, will join the fight at the end of the queue; usually these involve multiple characters being summoned at once.","l":1},{"p":"- In the screenshots below, the Player party engages Captain Sech Zapor in battle:","l":0},{"p":"1. Turn order is calculated normally at the start of the fight, taking into account the characters' Initiative values.","l":1},{"p":"2. As Sech Zapor has the highest Initiative (37), he gets the first turn; the four player characters will act back-to-back after him.","l":1},{"p":"3. Sech Zapor uses his turn to cast Captain's Orders, which summons three of his shipmates into battle. As part of an \"event,\" they join the fight at the end of the existing queue.","l":1},{"p":"4. Ifan is the next character to act; he uses Elemental Totem to summon a Wood Totem, which joins the turn queue immediately after him.","l":1},{"p":"5. Ifan then summons a Soul Wolf, which -- being the most recent character to join -- enters the Turn queue immediately after Ifan and before the Wood Totem.","l":1},{"p":"6. When the new round begins, turn order is recalculated, taking into account everyone's Initiative.","l":1},{"h":"[07] DELAY TURN FUNCTION"},{"p":"- Pressing the Shield (\"Delay Your Turn\") Icon near the bottom of the screen will push your current character to the very end of the turn queue for the current round.","l":0},{"p":"1. Note you can do this only if the character hasn't acted yet; it's not possible to \"split\" your character's turn.","l":1},{"p":"2. If multiple characters delay their turns, they will be placed in reverse order, with the highest-Initiative character going last.","l":1},{"p":"3. Characters who delay turns will act at the very end of the turn -- even later than other characters who subsequently join the fight.","l":1},{"p":"- You might sometimes want to delay your turn for two reasons: to manage crowd-control (CC) abilities against enemies, and to set up for a combo.","l":0},{"p":"- In the example below, Sebille gets her turn but finds that the only remaining enemy -- Halla -- has already been set to Sleeping.","l":0},{"p":"1. As Sebille doesn't have enough damage to kill Halla in a single skill rotation, she delays her turn rather than attack and wake Halla.","l":1},{"p":"2. Halla's gets her turn, but (with her sleep uninterrupted) she doesn't get to act.","l":1},{"p":"3. This allows the player's team -- including Sebille, who gets her turn back -- to finish Halla off or reapply another form of CC.","l":1},{"p":"- In the next example, Sebille has an opportunity to deliver AOE attacks but lacks the skills (Teleportation / Nether Swap) to stack additional enemies on top of the existing pile.","l":0},{"p":"- She delays her turn, so her teammates can do just that; when Sebille's turn comes back around, she gets two back-to-back turns to use several skills uninterrupted.","l":0},{"h":"[08] AP MANAGEMENT: GAINING AP"},{"p":"- Optimizing your AP use in the first round is arguably the single most important thing you can do to improve your chances in combat.","l":0},{"p":"- This is because in D:OS2, as in many party-based tactical RPGs, advantages gained early in the battle have a dramatically compounding effect:","l":0},{"p":"1. The more enemies you kill or disable in the first round, the less damage they'll be able to muster against you; and so the more characters you'll have the following round...","l":1},{"p":"2. This is less evident in the early game (where neither the player or enemies have access to high-damage skills), but becomes noticeable as early as the end of Act 1.","l":1},{"p":"- This section lists some AP-maximizing tools, just in case you aren't using them already.","l":0},{"p":"- Adrenaline (SCO1) is by far the most important skill for this purpose, and one that you should consider including in every build:","l":0},{"p":"1. This skill gives you 2AP, at the cost of 2AP on the next turn; this results in a net AP gain of 0, but (for the reason stated above) AP is far more valuable the earlier you have it.","l":1},{"p":"2. Note also that you always have the option to save up to 2AP for your following turn (4, when using Adrenaline) so there's almost never a reason not to use it.","l":1},{"p":"3. This skill synergizes especially well with Executioner Talent on your main damage dealers, by allowing them to secure kills which they otherwise wouldn't.","l":1},{"p":"4. Adrenaline becomes truly powerful when chained with Skin Graft skill -- see \"Adrenaline + Skin Graft Combo\" section below.","l":1},{"p":"- Flesh Sacrifice is an Elf racial skill that's also extremely valuable, to the point that many builds should consider using an Elven Mask just for the skill:","l":0},{"p":"1. It gives 1AP and a 10% damage boost at the cost of some CON (about 1/3 your level).","l":1},{"p":"2. The skill also creates a pool of blood beneath the caster, making it the best skill for activating Elemental Affinity Talent in Necromancer Builds.","l":1},{"p":"3. It can also be used repeatedly with Skin Graft; note, however, that the damage bonus doesn't stack.","l":1},{"p":"- Executioner is a Talent worth taking on every damage dealer, even elemental mages:","l":0},{"p":"1. It gives you 2AP upon delivering a killing blow yourself, once per turn.","l":1},{"p":"2. Note it's one of the few talents with a requirement (WAR 1), but even characters who don't benefit from Warfare should consider taking it.","l":1},{"p":"3. What makes it particularly good is its synergy with AP-boosting skills, like Adrenaline -- the more AP you have, the more likely you are to secure a kill and get even more AP.","l":1},{"p":"4. One downside to Executioner is that it conflicts with The Pawn, which is a great talent in its own right; generally, damage dealers will benefit more from Executioner.","l":1},{"p":"- Haste (PYR1) is one of two skills which apply Hasted status, and one that works best when you bring it on everyone in your party:","l":0},{"p":"1. The skill applies to its target \"Hasted\" status, which provides +1 Starting AP, +1 AP Recovery, and +2 movement speed.","l":1},{"p":"2. Hasting oneself will not give AP during the current turn, but it will give 1AP for each of the following two turns -- therefore, it is an \"investment\" skill on AP with a +1 net profit.","l":1},{"p":"3. Although the skill nets 1AP over three turns, its use (for AP, at least) is questionable for the same reason Adrenaline is good: AP is more valuable the earlier you use it.","l":1},{"p":"4. Despite this, it has a very specific use that makes it worth bringing it on your entire party: by targeting another character, you can effectively give them your spare AP.","l":1},{"p":"5. This allows for \"Haste Passing,\" where four characters in the same round each use Haste on the next character to apply Hasted on everyone for just 1AP total.","l":1},{"p":"6. This tactic is useful enough to warrant its own section: see \"Haste Passing\" below.","l":1},{"p":"- Ferocity is an Act-2-exclusive buff you can prepare before fights:","l":0},{"p":"- The status gives Start AP +2 and AP Recovery +2.","l":0},{"p":"- You can get the status by using a Ferocity Herbmix (Drudanae + Augmentor) at the Dreamer Pipe in Undertavern.","l":0},{"p":"- The 50-Turn duration means you can (with the use of Teleporter Pyramids) take the buff into any fight, or even several fights in a row.","l":0},{"p":"- Crafting and smoking a Potent Ferocity Herbmix (Ferocity Herbmix + Void-Tainted Crimson Bream) will give you the same buff for 100 turns.","l":0},{"p":"- The next two also deserve mention, but they have more conditional uses.","l":0},{"p":"- Tactical Retreat (HUN2) is the other skill that provides Hasted status:","l":0},{"p":"1. Tatical Retreat moves the caster to the targeted location and applies Hasted (to self); this skill also has a 1AP cost.","l":1},{"p":"2. The tradeoff for the mobility effect is that you can only use it on yourself.","l":1},{"p":"3. Therefore, unlike with Haste, there's no workaround that let will you reclaim the AP cost in the same round that it's used (Fane's Time Warp being the only exception).","l":1},{"p":"3. That said, the mobility effect alone makes the skill worthwhile -- so there's no reason not to use it, provided you already meet the skill requirements.","l":1},{"p":"- Glass Cannon can be worth taking, but only on very specific builds:","l":0},{"p":"1. The biggest downside to Glass Cannon is that enemies will target and disable characters who have it, if given the chance.","l":1},{"p":"2. It's therefore recommended you take it on just one character per party (if at all), and specifically on max-WIT builds that go all in on their first turn.","l":1},{"p":"3. A summoner would be an example of this; so would someone whose primary job is to stack enemies at the beginning of the battle (see \"Stacking Enemies\" section below).","l":1},{"h":"[09] AP MANAGEMENT: SAVING AP"},{"p":"- The previous section dealt with getting AP; this section deals with making most out of the AP you have.","l":0},{"p":"- There are two ways of \"saving\" AP:","l":0},{"p":"1. Using tools that specifically reduce the AP cost of (some or all) actions.","l":1},{"p":"2. Optimizing your skill rotation, so that you can achieve the same goals with fewer actions.","l":1},{"p":"- The first is done almost exclusively with Elemental Affinity Talent, Scrolls (especially with Ambidextrous Talent), and Green Tea (Act 4):","l":0},{"p":"1. Elemental Affinity reduces the cost of certain skills, depending on the surface you're standing on -- see \"Making Use of Elemental Affinity Talent\" below.","l":1},{"p":"2. Some scrolls cost fewer AP to use than their skill counterparts; Ambidextrous further reduces the cost of scrolls by 1AP. See \"Making Use of Ambidextrous Talent\" below.","l":1},{"p":"3. Green Tea (bought from Lady Kemm, Act 4) reduces the cost of every action by 2AP, down to a minimum of 1AP.","l":1},{"p":"This effect is one of the most powerful in the game -- keep in mind that using it can make most battles trivial.","l":2},{"p":"- The second is easier said than done, since every build will have its own skill pools (and therefore different rotations that are optimal).","l":0},{"p":"- However, there are some rules of thumb which are applicable across different builds:","l":0},{"p":"1. Stack enemies together, whenever possible.","l":1},{"p":"- Piling enemies together with Teleportation and Nether Swap will multiply your damage output severalfold, as you'll be hitting multiple enemies with the same amount of AP.","l":2},{"p":"- Crucially, you will also be able to target multiple enemies with area-of-effect CC skills after (hopefully) stripping them of armor.","l":2},{"p":"- Due to the abundance of AOE skills, this is a universally viable strategy (to the point that it warrants elaboration -- see \"Stacking Enemies\" section below).","l":2},{"p":"2. Use damage-boosting buffs before attacks. This is a rather obvious point, but it's easy to forget when you can benefit from damage boosts:","l":1},{"p":"- This mostly applies to Flesh Sacrifice, which you should generally use early in your rotation for the 10% damage boost.","l":2},{"p":"3. Likewise, mages should generally look ways to lower the targets' resistances before attacking:","l":1},{"p":"- Rain (HYD1) lowers Water and Air resistances (-10% and -20%) ignoring Magic Armor and should be used before attacks, both for the damage and increased chance of CC.","l":2},{"p":"- Fire users should strongly consider taking Torturer talent, since Burning lowers Fire Resistance (-15%).","l":2},{"h":"[10] STACKING ENEMIES"},{"p":"- Teleportation and Nether Swap (both AER2) are skills you can use to move enemies around in combat.","l":0},{"p":"- The main reason you would want to move enemies is, of course, to pile them up and hit them with AOE and forking skills.","l":0},{"p":"- The main difficulty with this plan is that enemies have ideas of their own and will tend to move away from where you put them. There are several ways to mitigate this:","l":0},{"p":"1. In the early game (where damage output is fairly low on both sides), you can have your characters delay their turns so they can stack and attack enemies in back-to-back turns.","l":1},{"p":"2. By targeting enemies near the end of the turn queue, you can ensure that you'll get at least several attacks off before they're able to move away.","l":1},{"p":"3. You can try to hold enemies in place with Spin Web (POL2) or Torturer + Worm Tremor (GEO2).","l":1},{"p":"4. You can have one character perform most of the stacking in a single turn, so that it takes time for enemies to disperse.","l":1},{"p":"- In the screenshots below, Sebille initiates combat, creates a pile by bringing in two enemies with Nether Swap and Teleportation, then finishes up with Spin Web (for 5AP).","l":0},{"p":"1. This is not the optimal rotation for stacking, but it illustrates the basic concept (Approach > Nether Swap > Teleportation > Immobilize) which most builds can use.","l":1},{"p":"2. Note there are several things working in the player's favor in this example: Sebille gets to walk up and attack, gets first turn, and has two enemies already standing together.","l":1},{"p":"- In practice, you may encounter many challenges: immovable enemies, enemies out of range, line of sight problems...","l":0},{"p":"- Despite this, the damage-multiplying effect makes stacking almost always worth doing. Some points of note:","l":0},{"p":"1. Teleportation Scrolls have no cooldown and costs 1AP with Ambidextrous talent; this makes them some of the best scrolls to use (and usually the best use for Air Essences).","l":1},{"p":"2. Barring special reasons, use Nether Swap first to maximize the number of enemies hit with Teleportation.","l":1},{"p":"3. Torturer + Worm Tremor may seem costly (both stat- and AP-wise), but it turns out to be one of the most useful combos in the game -- see \"Torturer + Worm Tremor Combo.\"","l":1},{"h":"[11] ADRENALINE + SKIN GRAFT COMBO"},{"p":"- Skin Graft (POL3) resets all of your cooldowns, at the cost of 1AP and 1SP.","l":0},{"p":"- To get the most mileage out of the skill, combine it with AP-boosting effects, so you can maximize your AP on your current turn:","l":0},{"p":"1. Using Adrenaline > Skin Graft > Adrenaline will give you 3AP, at the cost of 1SP.","l":1},{"p":"2. Using Flesh Sacrifice > Adrenaline > Skin Graft > Adrenaline > Flesh Sacrifice will give you 5AP, at the cost of 1SP.","l":1},{"p":"3. Note these are \"all in\" combos: the negative effect of Adrenaline stacks, meaning if you use Adrenaline twice in one turn, you may not be able to act on your next.","l":1},{"p":"- With Skin Graft's 1SP cost and cooldown-refreshing effect, some builds can get more use out of the combo than others.","l":0},{"p":"- Builds with access to powerful 1SP skills (like Pyromancer's Deploy Mass Traps) can straightforwardly weave them in before and after Skin Graft to get two uses out of them.","l":0},{"p":"- With builds that rely on 2SP+ skills to do damage, you'll likely want to start off with Apotheosis:","l":0},{"p":"1. Note that, with Apotheosis's own 2AP cost, you will almost certainly need Flesh Sacrifice to use the combo effectively.","l":1},{"p":"2. Builds using low-AP, high-SP skills (like Necromancer's Grasp of the Starved and Aerotheurge's Closed Circuit) will get the most use out of Apotheosis + Skin Graft.","l":1},{"p":"- Once you're familiar with the combo, you can further save on AP by substituting Skin Graft and Apotheosis with their Scroll counterparts.","l":0},{"p":"1. Crucially, Skin Graft Scrolls (Source Orb + Animal Scales + Sheet of Paper) costs 0AP to use and can be used repeatedly in battle, even within the same turn.","l":1},{"p":"2. This means you can keep using Adrenaline (+ Flesh Sacrifice) to get some AP each time you use the scroll, extending your turn indefinitely (so long as you have scrolls to use).","l":1},{"p":"3. Apotheosis Scrolls (Source Orb + Puppet Bead + Sheet of Paper) cost 1AP to use, which saves 1AP (in addition to freeing up 3 Memory Slots).","l":1},{"h":"[12] TORTURER + WORM TREMOR COMBO"},{"p":"- The Torturer Talent allows the following statuses to apply through armor and extends their duration by one turn:","l":0},{"p":"Burning, Poisoned, Bleeding, Necrofire, Acid, Suffocating, Entangled, Death Wish, and Ruptured Tendons.","l":1},{"p":"- Of these, Entangled -- applied with Worm Tremor skill (GEO2) -- is noteworthy in that it's the only one which immobilizes; with Torturer, it affects targets for 3 turns.","l":0},{"p":"- This combo turns out to be an extremely powerful one, since being immobilized with no one nearby to attack for that long is functionally equal to being kicked out of the fight.","l":0},{"p":"- Therefore, a well-placed Torturer + Worm Tremor -- such as against an enemy with no ranged skills -- will turn a difficult fight into a manageable one.","l":0},{"p":"- The following example shows one way the combo might be incorporated into a build, alongside other tactics already mentioned:","l":0},{"p":"1. In the screenshots below, the player party engages five enemies in battle, with Sebille the first to act.","l":1},{"p":"2. With Glass Cannon Talent and Adrenaline + Flesh Sacrifice + Skin Graft combo, Sebille is guaranteed to make a pile of five enemies with at least 3AP remaining.","l":1},{"p":"3. Owing to some fortunate positioning on her teammates' part, she ends up doing this with 4AP left.","l":1},{"p":"4. She closes her turn with Worm Tremor and Black Shroud, which prevents movement and attacks from the enemy party.","l":1},{"p":"- With Far Out Man, the combo can be used as an exploit:","l":0},{"p":"1. In the screenshots below, Sebille teleports Ryker and his minion away to near max range and closes her turn with Worm Tremor.","l":1},{"p":"2. Sebille's Far Out Man Talent ensures she can attack them, but they can't retaliate; even with Walk It Off Talent, Ryker is immobilized for two turns.","l":1},{"p":"3. Two turns later, Ifan teleports another enemy and reapplies Entangled; with Skin Graft and/or sufficiently many characters, this can be kept up more or less indefinitely.","l":1},{"p":"- It's worth noting that Enwebbed (via Polymorph's Spider Legs > Spin Web) often does the same job shown here, without the Torturer Talent and for cheaper (just 2AP).","l":0},{"p":"- Keep in mind, however, that enemies can (and very often will) remove it with fire skills; it also lasts just one turn, so it's less AP-efficient in the long run.","l":0},{"p":"- One final point worth mentioning is that, although Entangled prevents the use of mobility skills, enemies can get to you using Backlash and Blitz Attack.","l":0},{"p":"- You can work around this by staying outside the range of these skills (10m, which is considerably shorter than most ranged skills).","l":0},{"h":"[13] HASTE PASSING"},{"p":"- This tactic is straightforward and doesn't require much explanation; it's also one of the most useful.","l":0},{"p":"- It involves a full party of four characters each casting Haste on the next ally to act, with the last character in the round casting on the first character to close the loop.","l":0},{"p":"- Since getting Hasted gives each character +1AP at the start of their turn, the characters are effectively \"passing around\" the 1AP to apply Hasted status across the entire party.","l":0},{"p":"- The effect is -1AP in the first round for the character who sets off the chain, +4AP in the second round (1 for each character), and +1AP in the third round to the initial caster.","l":0},{"p":"- Prepare by bringing Haste skill on everybody:","l":0},{"p":"1. The tactic is powerful enough to warrant getting PYR1 on everyone; doing so will also give you access to Peace of Mind and help you towards Throw Explosive Trap.","l":1},{"p":"2. In the late game, you'll likely have several characters PYR1 from Mystical Giant Flame Runes in their amulets (PYR+1, Crit Chance +6%) anyway.","l":1},{"p":"3. Otherwise, consider making Haste Scrolls (Fire Essence + Claw + Sheet of Paper) and using them in just the important fights.","l":1},{"p":"- Once battle starts, have each character use Haste on the next in the turn queue.","l":0},{"p":"1. Each character (after the first) will start their turn with 1 extra AP -- this is the 1AP you want to pass onto the next character.","l":1},{"p":"2. If, at any point, a character desperately needs the 1AP, they can just spend it to end the chain with no harm done -- figure out what works best for your current situation.","l":1},{"p":"- If the battle goes into the fourth turn, repeat to reap another 4AP.","l":0},{"h":"[14] MAKING USE OF ELEMENTAL AFFINITY TALENT"},{"p":"- Elemental Affinity Talent reduces the AP cost of skills by 1 (to a minimum of 1) when you're standing in a surface of the matching type, including Blessed and Cursed surfaces.","l":0},{"p":"- The bonuses only apply to elemental magic schools: Pyrokinetic, Hydrosophist, Geomancer, Aerotheurge, and also Necromancer.","l":0},{"p":"- With most skills costing 2AP, this is one of the best talents in the game (and one most mage should consider getting early on).","l":0},{"p":"- It goes without saying that you should activate it as early in your rotation as you can, so you can make the most of it. This section discusses how you can do this efficiently.","l":0},{"p":"- Note some of what follows is more than just basic information; there's some discussion of specific rotations as well.","l":0},{"p":"- Pyrokinetic skills benefit from Elemental Affinity when the caster is standing in Fire:","l":0},{"p":"1. It's recommended you set up opening with Searing Daggers, throwing one dagger on yourself and two at enemies.","l":1},{"p":"With Torturer Talent, this also will let you apply Burning on at least two enemies from the start, justifying the 2AP cost.","l":2},{"p":"If you have Ambidextrous Talent (also well worth having on Fire Mages), you can use a Searing Daggers Scroll (Fire Essence + Tooth + Sheet of Paper) for just 1AP.","l":2},{"p":"2. If there are oil or poison surfaces lying around, casting Ignition and using Tactical Retreat on the ignited surface can be more efficient:","l":1},{"p":"Ignition does more damage than a single Searing Dagger (though less than two), and can potentially hit more enemies.","l":2},{"p":"Using Tactical Retreat to jump onto fire will do less damage to you than casting Searing Daggers on yourself, and will also apply Hasted.","l":2},{"p":"Note, however, that Ignition will not (usually) create Fire surfaces near enemies, which can make it more difficult to follow up with Explosive Trap(s).","l":2},{"p":"3. Taking The Pawn Talent on Fire Mages to walk on to Fire is not recommended, as Fire Mages can expect to benefit from Executioner almost every turn they get.","l":1},{"p":"- Hydrosophist skills benefit from Elemental Affinity when the caster is standing on Water or Ice:","l":0},{"p":"1. Rain is by far the best choice for this, as it only costs 1AP and also applies Wet status to enemies.","l":1},{"p":"Think always before casting Rain, however, as it's one of the easiest ways to accidentally sabotage yourself (by stunning and freezing your own characters).","l":2},{"p":"Also note the actual surface created can be quite smaller than expected: you should aim the skill no farther than 4.4m, if you want to be standing in the puddle created.","l":2},{"p":"2. Electrified Water surfaces still count as water, meaning both Aerotheurge and Hydorophist skills benefit from them.","l":1},{"p":"- Geomancer skills benefit from Elemental Affinity when the caster is standing on Oil or Poison.","l":0},{"p":"1. The best method by far is to get access to Elf Form as soon as possible, then open with Flesh Sacrifice > Contamination.","l":1},{"p":"In some rare instances (such as against Undead enemies, or if you're in danger of dying), consider Flesh Sacrifice > Turn to Oil instead.","l":2},{"p":"2. At Level 16 and onwards, your Geomancer's most powerful rotation is a double Pyroclastic Eruption cast with Apotheosis + Skin Graft:","l":1},{"p":"- With Elemental Affinity, you will be able to cast an additional 2AP skill (along with two casts of Contamination). This makes it one of the most valuable talents for the build.","l":2},{"p":"- Note Flesh Sacrifice (after Skin Graft) will erase your existing poison puddle, but Skin Graft will remedy this by resetting other cooldowns. So your rotation might look like this:","l":2},{"p":"(Apotheosis > Adrenaline > Flesh Sacrifice > Contamination > Pyroclastic > Skin Graft > Adrenaline > Flesh Sacrifice > Contamination > Pyroclastic > Impalement)","l":3},{"p":"3. If you're not using Elf Form, your option will be more limited and largely situational. Here are some ideas, from most ideal to least ideal:","l":1},{"p":"- If you somehow find yourself already standing in a water or blood surface, you can use Contamination or Turn to Oil.","l":2},{"p":"- Otherwise, jump onto any nearby nearby oil or poison puddle.","l":2},{"p":"- Otherwise, if there's a high-priority target close by (within 6m), use Impalement on both yourself and the target.","l":2},{"p":"- Otherwise, use Oil Flask or Poison Flask on yourself with Ambidextrous Talent (Geomancers should strongly consider Ambidextrous, for the 1AP Impalement Scroll cast).","l":2},{"p":"4. Undead characters should generally resist the urge to cast Poison Dart just to activate Elemental Affinity, as Vitality healing tends to be an inefficient use of AP.","l":1},{"p":"- Aerotheurge skills benefit from Elemental Affinity when the caster is standing on Electrified Water or Electrified Blood.","l":0},{"p":"1. This is by far the most difficult to use well, because an Aerotheurge's rotation is already AP-intensive.","l":1},{"p":"2. In short, how you should set up Elemental Affinity depends on whether you're attempting to maximize damage with 2x Closed Circuits in a single rotation.","l":1},{"p":"- In regular fights, get within fairly close range (within 8.8m) of your primary target, then just cast Rain and any shocking spell.","l":2},{"p":"- In difficult fights, jump into melee range of your primary target, then use Flesh Sacrifice and some 1AP tool to electrify your blood pool (more on this below).","l":2},{"p":"3. In regular fights, or if you don't have Elf Form, the recommended option is simple:","l":1},{"p":"- Cast Rain, then follow up with any shocking skill (like Chain Lightning) to simultaneously attack your target and electrify the surface you're both standing in.","l":2},{"p":"- Note you'll want to make sure you and your target will be standing in the same puddle of water:","l":2},{"p":"- Make sure you're fairly close to your target (within 8.8m); use a jump skill if needed.","l":3},{"p":"- Cast Rain halfway between you and your target; as with Hydrosophist, you should be casting Rain no farther than 4.4m.","l":3},{"p":"- Note you can afford to aim a little farther, if you have Flesh Sacrifice (as electricity will travel between water and blood surfaces).","l":3},{"p":"- Use AP-boosting skills beforehand, if you want to extend your rotation. The following rotation (with 2x Chain Lightning casts) will do a fair amount of damage:","l":3},{"p":"(Jump > Adrenaline > Flesh Sacrifice > Rain > Chain Lightning > Skin Graft > Adrenaline > Flesh Sacrifice > Chain Lightning > any 2AP skill)","l":4},{"p":"4. In difficult fights, you'll want to use Flesh Sacrifice and an 1AP tool to electrify your blood surface.","l":1},{"p":"- Explaining the reasoning behind this requires some discussion of Flesh Sacrifice:","l":2},{"p":"- When you use Flesh Sacrifice and a shocking skill (like Shocking Touch or Electric Discharge), your blood pool can get electrified depending on your distance to the target.","l":3},{"p":"- If the target is fairly close (1.3m or less with Shocking Touch), your pool will be electrified even if the target isn't strictly standing in it (as shown below).","l":3},{"p":"- Shocking Touch is used here, as it accurately measures distance no matter where on the target you aim the skill -- but any shocking spell will work within this distance.","l":3},{"p":"- This makes Flesh Sacrifice the best skill for activating Elemental Affinity, since Aerotheurges typically want to get close to the enemy anyway (for skills like Closed Circuit).","l":2},{"p":"- In fact, the strongest Aerotheurge rotations (assuming a 4AP build) involve 2x Closed Circuits, with Apotheosis and Skin Graft.","l":2},{"p":"- However, players attempting to use Apotheosis and Elemental Affinity and Closed Circuit and Skin Graft will find they don't have actually enough AP (on 4AP builds):","l":2},{"p":"(Apotheosis > Jump > Adrenaline > Flesh Sacrifice > Shocking Touch > Closed Circuit > Skin Graft > 0AP (?)","l":3},{"p":"- Therefore, to complete a 2x Closed Circuit rotation, you will have to find a way of electrifying your blood puddle for just 1AP.","l":2},{"p":"- The best way to do this is to use a Shocking Touch Scroll (1AP), Electric Discharge Scroll (1AP with Ambidextrous), or Thunderbolt Grenade (1AP with Ambidextrous).","l":2},{"p":"- Doing this will let you complete very powerful rotations, like the following involving 2x Closed Circuits and 1x Chain Lightning:","l":2},{"p":"(Apotheosis > Jump > Adrenaline > Flesh Sacrifice > 1AP Tool > Closed Circuit > Skin Graft > Adrenaline > Flesh Sacrifice > Rain > Chain Lightning > Closed Circuit)","l":3},{"p":"- In conclusion:","l":2},{"p":"- Flesh Sacrifice combined with Shocking Touch / Electric Discharge Scroll / Thunderbolt Grenade is the best option for activating Elemental Affinity.","l":3},{"p":"- You'll want to save this for the most difficult fights (where the use of Aerotheurge scrolls -- potentially costing Air Essences -- is justified).","l":3},{"p":"Otherwise, consider forgoing Elemental Affinity altogether: you can also cast Jump + Closed Circuit + Chain Lightning for just 6AP (assuming Adrenaline), which is still good.","l":2},{"p":"- Necromancer skills benefit from Elemental Affinity when the caster is standing in Blood.","l":0},{"p":"1. Flesh Sacrifice is the best option, without question: it's this combination of Flesh Sacrifice and Elemental Affinity which makes Necromancers one of the best builds.","l":1},{"p":"- Make sure you're well-positioned before casting Flesh Sacrifice.","l":2},{"p":"2. Otherwise, jumping onto some Blood is the next best option -- as you're likely running a Physical Damage party, Blood will be easy to come by in most cases.","l":1},{"p":"3. If you're ever using Raining Blood (to simultaneously set up for Grasp of the Starved?), aim it no farther than 3.2m from yourself or your target(s).","l":1},{"h":"[15] MAKING USE OF AMBIDEXTROUS TALENT"},{"p":"- Scrolls are some of the best tools in the game, as they let you cast skills without cooldowns, without Source Points, and sometimes at a reduced AP cost.","l":0},{"p":"- Here are some scrolls worth using, with or without Ambidextrous Talent:","l":0},{"p":"- Skin Graft (Source Orb + Animal Scales + Sheet of Paper): 0AP cost (saves 1AP 1SP)","l":1},{"p":"- Apotheosis (Source Orb + Puppet Bead + Sheet of Paper): 1AP cost (saves 1AP 3SP)","l":1},{"p":"- Grasp of the Starved (Source Orb/High Quality Shadow Essence + Disembodied Hand + Sheet of Paper): 2AP cost (saves 2SP)","l":1},{"p":"- Chicken Claw (Life Essence + Chicken Foot + Sheet of Paper): 1AP cost (saves 1AP)","l":1},{"p":"- Winter Blast (Water Essence + Plaice + Sheet of Paper): 1AP cost (saves 1AP)","l":1},{"p":"- Elemental Totem (Tormented Soul + Wooden Doll + Sheet of Paper): 1AP cost (saves 1AP)","l":1},{"p":"- Ambidextrous talent further increases the viability of scrolls, by decreasing their AP cost by 1 when the offhand is free.","l":0},{"p":"- Note \"offhand free\" in the in-game description deceptive: the talent works even with two-handed weapons, including Bows, Crossbows, and Staves.","l":1},{"p":"- The following are some scrolls that work especially well with Ambidextrous Talent:","l":0},{"p":"- Teleportation (Air Essence + Feather + Sheet of Paper) scrolls become 1AP, making it much easier to stack and burst down enemies.","l":1},{"p":"- Tentacle Lash (Life Essence + Rat Tail + Sheet of Paper) scrolls become 1AP, making it the most efficient (125% per AP) damage tool for STR-based builds, barring crits.","l":1},{"p":"- Searing Daggers (Fire Essence + Tooth + Sheet of Paper) scrolls become 1AP, saving some AP in a regular rotation.","l":1},{"p":"- Fireball (Fire Essence + Sharp Claw + Sheet of Paper) scrolls become 1AP, saving some AP in a regular rotation.","l":1},{"p":"- Deep Freeze (Alien Water Essence + Mackerel + Sheet of Paper) scrolls become 1AP, making it the most efficient (150% per AP) damage tool for Hydrosophists.","l":1},{"p":"- Impalement (Earth Essence + Sharp Piece of Metal + Sheet of Paper) scrolls become 1AP, saving some AP in a regular rotation.","l":1},{"p":"- Poison Dart (Earth Essence + Fly Agaric Mushroom + Sheet of Paper) scrolls become 1AP, saving some AP in a regular rotation.","l":1},{"p":"- Shocking Touch (Air Essence + Flour + Sheet of Paper) scrolls become 1AP, allowing access to some Apotheosis rotations.","l":1},{"p":"- Finally, Ambidextrous reduces the cost of grenades to 1AP:","l":0},{"p":"- Mind Maggot Grenades and Love Grenades, already some of the best CC tools for Magic Damage parties, become even more viable.","l":1},{"p":"- Frost Grenades and Thunderbolt Grenades become viable Area-of-Effect CC tools in the hands of Magical Damage parties.","l":1},{"p":"- Tremor Grenades become viable CC tools in the hands of Physical Damage parties, and give characters like archers access to a 1AP, Area-of-Effect Knockdown tool.","l":1},{"h":"[16] THROWING EXPLOSIVE TRAPS FROM OUTSIDE COMBAT"},{"p":"- In the example below, the player party engages some Magisters in battle, but Ifan stays behind and approaches the battle without entering it.","l":0},{"p":"1. Note that, if Ifan were to sneak up on the enemies and attack, he would be forced into the battle -- and at the end of the turn queue, at that.","l":1},{"p":"2. It turns out, however, he can Throw Explosive Traps onto the battlefield (as in the first screenshot below) without entering battle.","l":1},{"p":"3. Crucially, the Traps themselves \"join the battle,\" as shown by the turn queue in the second screenshot below, while Ifan does not.","l":1},{"p":"4. Moreover, as the traps are now frozen in the turn queue (like everyone else in battle), they do not time out -- meaning Ifan can keep throwing many traps as he likes.","l":1},{"p":"5. With sufficiently many traps, another character could teleport an enemy near the pile of traps and detonate it to kill them outright.","l":1},{"p":"- This exploit makes most fights in the game trivial, if the player wants them to be; it also removes the need to cheese fights with Deathfog.","l":0},{"p":"- In the next screenshot below, Ifan approaches the same battle from the other side.","l":0},{"p":"1. Due to high ground, he has enough range to throw the traps within exploding radius of some enemies below.","l":1},{"p":"2. Moreover, by this time the other characters have prepared the battlefield by creating some fire on the nearby ground.","l":1},{"p":"3. By throwing the traps directly into the fire, he can detonate his traps immediately, meaning he can freely deal damage to the enemies while they're frozen in battle.","l":1},{"h":"[17] SOUL MATE + HEALING POTION COMBO"},{"p":"- Soul Mate (SUM2) skill allows the caster of the skill to share any subsequent healing they receive with the target character.","l":0},{"p":"- This turns out to be a powerful tool against Undead enemies:","l":0},{"p":"1. When a living character casts it on an undead and heals up, the undead character takes the same amount in damage (as if the healing tool had been used on them).","l":1},{"p":"2. In particular, drinking health potions deal very high damage, as potions tend to heal for very high values.","l":1},{"p":"- You can use this to kill most undead enemies in the game. Some points of note:","l":0},{"p":"1. You can craft Soul Mate Scrolls (Tormented Soul + Wheat + Sheet of Paper) to use the skill without having to invest in Summoning.","l":1},{"p":"2. Five Star Diner Talent will double the healing effect of potions, doubling your damage output.","l":1},{"p":"3. You can combine two healing potions to get one of a higher quality; this will let you save some AP when using the combo.","l":1},{"p":"- If the Soul Mate caster is undead, the results are not as you might expect (and are all mostly useless):","l":0},{"p":"1. If an undead character targets a living one and drinks a Poison Bottle, both characters will be healed.","l":1},{"p":"2. If an undead character targets a living one and drinks a Healing Potion, the undead will take damage and the living will be healed.","l":1},{"p":"3. If an undead character targets an undead and drinks a Poison Bottle, both characters will be healed.","l":1},{"p":"4. If an undead character targets an undead and drinks a Healing Potion, both characters will take damage.","l":1},{"h":"[18] BUFF STACKING BEFORE BATTLE"},{"p":"- One way to get an advantage in fights is to apply buffs (stat-boosting effects) before entering battle.","l":0},{"p":"- This is functionally equivalent to having extra AP in battle, since you're effectively reaping the benefits of the buffs without having spent the AP to cast the skills.","l":0},{"p":"- The easiest ones to use are Bedroll and Encouraged, but you can apply any number of buffs -- casting time and buff durations being the only limiting factors.","l":0},{"p":"- You can get around even this limitation by holding characters in conversation; characters in conversation are \"frozen in time,\" and any finite-duration buffs on them will stay paused.","l":0},{"p":"- In the screenshot below, one character talks to Sir Lora, while the Player Avatar talks to a third character.","l":0},{"p":"- This holds three people in conversation, allowing a fourth character to stack every buff available on each of them.","l":0},{"p":"- There are dozens of buffs you can use, but casting even just Peace of Mind and Haste on everyone will give you a significant advantage at the start of battle.","l":0}]],["Fight guide",[{"h":"DETAILED GUIDE FOR SELECT ITEMS (#01 - #30)"},{"p":"Prologue: #01 Fighting Captain Kalwyn on the Merryweather","l":0},{"p":"Act 1: #02 Kniles the Flenser Fight, #03 Dallis Fight (Fort Joy), #04 Slane Fight, #05 Bishop Alexandar Fight (Harbour), #06 Dallis Fight (Lady Vengeance)","l":0},{"p":"Act 2: #07 Ryker Fight, #08 Lamenting Abomination Fight, #09 Magisters Vorrh and Reimond Fight, #10 Mor the Trenchmouthed Fight, #11 Wrecker's Cave Entrance, #12 Hannag Fight, #13 Alice Alisceon Fight, #14 Jahan Fight, #15 The Eternal Aetera Fight","l":0},{"p":"Act 3: #16 The Sallow Man Fight, #17 Bishop Alexandar Fight (Temple), #18 Killing Dallis's Minions at the Wellspring, #19 Source Titan Fight","l":0},{"p":"Act 4: #20 Killing Justinia's Guards, #21 Linder Kemm Fight (Reimond's Lair), #22 Karon Fight, #23 Lucian's
