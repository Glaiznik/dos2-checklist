Crypt Puzzle, #24 Loic the Immaculate Fight, #25 Horrorsleep Arena Fight, #26 Contaminated Horror Fight, #27 The Devourer Fight, #28 Adramahlihk Fight, #29 Djinn Fight, #30 The Final Fight","l":0},{"h":"#01: FIGHTING CAPTAIN KALWYN ON THE MERRYWEATHER"},{"p":"- If you manage to trigger a fight with Captain Kalwyn and her Magister Knight before their scripted death, you will get 200XP.","l":0},{"p":"- Stand just inside the vision range [40, 18] of the Magister Knight (assuming Sneaking 0) and attack with an AOE skill to trigger a fight.","l":0},{"p":"- There is a Fireball Scroll on a dead Magister Knight [18, 19], which you can use to get off one free attack; consider saving beforehand.","l":0},{"p":"- Aiming the Fireball on the floor at the Magister Knight's feet (as shown below) appears to guarantee success:","l":0},{"h":"#02: KNILES THE FLENSER FIGHT"},{"p":"- The main threat in this fight is Kniles, who can one-turn-kill most characters with a Backlash combo.","l":0},{"p":"- Kniles also has a Love Grenade, which has an area of effect and will likely cripple your party (if he gets to use it).","l":0},{"p":"- The Agitated Silent Monks can also use Silencing Stare, which is a threat to Magic Damage parties.","l":0},{"p":"- You can soften up the group before the fight by Teleporting the two minions to the south toward you, as shown in the screenshots below:","l":0},{"p":"- At Level 5, it's unlikely that you'll be able to win in a straightforward DPS race; it's therefore recommended that you bring several sources of CC.","l":0},{"p":"1. Sucker Punch and Chicken Claw are great CC tools here (even for magic damage parties), as none of the Silent Monks or Meat Golems have any Physical Armor.","l":1},{"p":"2. Note dual-wielding characters can get access to Sucker Punch by unequipping their offhand weapon; note unequipping costs 0AP, even in battle.","l":1},{"p":"3. Magic Damage parties can also use Chloroform (SCO1), as well as Sabotage (PYR1 SCO1) on Kniles (to detonate his Love Grenade).","l":1},{"p":"- Begin the fight by attacking Kniles or pickpocketing his Love Grenade (requires Thievery 3), then burst him down as quickly as possible.","l":0},{"p":"- As all the enemies in this fight all have INI 12, Kniles may or may not get an early turn; Teleport him away as needed, so he doesn't get a full combo off.","l":0},{"p":"- Interestingly, neither the Monks nor the Meat Golems have sight cones, so you can effectively escape battle by entering Sneak Mode in case of an emergency.","l":0},{"h":"#03: DALLIS FIGHT (FORT JOY)"},{"p":"- This fight is difficult at Level 6 and requires careful turn and movement planning.","l":0},{"p":"- The most reliable way to do this fight without exploits is to use just one character with Lone Wolf Talent weaving in and out of Invisibility.","l":0},{"p":"- The first phase of the fight involves making Dallis retreat:","l":0},{"p":"1. Prepare a Lone Wolf character with Chameleon Cloak (POL1), Adrenaline (SCO1), and Teleportation (via Gloves of Teleportation).","l":1},{"p":"2. Bring one or two Invisibility Potions (obtainable from Griff, Narin, and Silence) and some Restoration Scrolls (handed out for free by Margo).","l":1},{"p":"3. Open the fight, making sure you're far enough from Dallis that she can't get to you on her first turn.","l":1},{"p":"4. Get as many attacks off as you can on Dallis on your first turn (using skills like Adrenaline), then use your last AP to cast Chameleon Cloak.","l":1},{"p":"5. Wait until your last turn of Invisibility, then get more attacks off and re-enter Invisibility with an Invisibility Potion.","l":1},{"p":"6. By your last turn of Invisibility, Chameleon Cloak should be back up -- so that you can repeat as needed (though you shouldn't need to use a second Invisibility Potion).","l":1},{"p":"7. Peace of Mind (PYR1/Scrolls) will boost your accuracy, so that you can hit Dallis reliably; Tentacle Lash (POL1) is also useful, as it deals high damage and never misses.","l":1},{"p":"- The moment Dallis gets to 252 Health or lower (assuming Physical Damage), she will retreat, ending whoever's turn it is.","l":0},{"p":"- Crucially, she will knock down all nearby characters as she leaves; this can be dangerous, since (if you get knocked down here) any surviving Gheist will likely get turn priority.","l":0},{"p":"1. To prevent this, ensure you get to INI 14+ (using Peace of Mind, etc.) on the same round that Dallis retreats.","l":1},{"p":"2. Alternatively, have Dallis take enough damage on her turn (through Bleed damage, Restoration tick, etc.) to retreat, so that you can act immediately afterwards.","l":1},{"p":"- After Dallis leaves, kill (in order) the Gheists, the Magister Ranger (Sevek), and the three Magister Swordsmen (Borris, Timery, Hansa).","l":0},{"p":"1. Killing the Gheists will be easy, provided you bring some CC skills; having Teleportation will also help stack the Gheists together so you can hit them with AOE.","l":1},{"p":"2. Keep in mind that Magister Sevek can carry a Knockout Arrow.","l":1},{"p":"3. The Magister Swordsmen are best left until the end, as they constantly use Shields Up and aren't much of a damage threat.","l":1},{"p":"- If you're open to cheese, using Throw Explosive Trap (PYR1 HUN1) is probably the simplest strategy that doesn't involve Deathfog:","l":0},{"p":"1. Start the fight with a character and create some fire.","l":1},{"p":"2. Once Dallis acts, have another character stand above the ladder entrance to Fort Joy and throw Explosive Traps without entering combat.","l":1},{"h":"#04: SLANE FIGHT"},{"p":"- You will be fighting Slane in his Dragon Knight (Lizard) form, which has access to the same skills (Dragonfall, Frost Breath, Whirlwing), plus Battle Stomp.","l":0},{"p":"- However, his regular attacks will be weaker (70+, as opposed to 100+), and he will be vulnerable to Teleportation.","l":0},{"p":"- Slane's main threat is Frost Breath, which typically deals 130+ magic damage and freezes everyone in a large cone; spread your characters out around Slane before the fight.","l":0},{"p":"- Bursting through his armor is easy for a Physical damage party, but difficult for a Magic damage party (as Slane has 597/946 armor and permanent Soothing Cold effect).","l":0},{"p":"- Some ideas for this fight:","l":0},{"p":"1. Slane has INI 19, so get a character to INI 20+ to get the first attack on him.","l":1},{"p":"2. Blessed Fire grants Immunity to Frozen and can be created with 4AP (Rain > Bless > Contamination > Drop Candle).","l":1},{"p":"3. Chicken Claw (POL1) and Chloroform (SCO1) are cheap, low-investment sources of CC.","l":1},{"p":"4. Ambidextrous + Fire/Earth/Poison scrolls can help you get through Slane's Magic Armor a little faster.","l":1},{"p":"- If all else fails, cheese the fight by hiding your party members near the Abandoned Camp and getting off free attacks from high ground.","l":0},{"h":"#05: BISHOP ALEXANDAR FIGHT (HARBOUR)"},{"p":"- There's nothing to be gained from talking to Alexandar, so feel free to set up for the fight by sneaking up on his group (make sure to unchain everyone).","l":0},{"p":"- A good position is the Magister Metamorph's lookout spot; she has a looping patrol pattern, so sneaking up on her should be straightforward.","l":0},{"p":"- Once positioned on the high platform, you can get several turns of free attacks:","l":0},{"p":"1. Open the fight by Teleporting the Metamorph below; prioritize her, as she has Teleportation too.","l":1},{"p":"2. End your characters' turns away from the ledge, so the enemies can't get a line of sight on you; The Gheist, in particular, can't ever reach you without Backlash.","l":1},{"p":"- Once the Voidwoken Drillworm appears, Alexandar's group will generally (though not completely) prioritize attacking it over you.","l":0},{"p":"1. Take advantage of this by holding on to a jump skill until it appears, so you can get as far away as you can if needed (dispersing your characters, if you're in a tight spot).","l":1},{"p":"2. You can even enter Invisibility/Sneak Mode to prevent the Drillworm from repositioning next to your vulnerable characters.","l":1},{"p":"3. Be careful if fighting the Drillworm yourself; as Earth Corruption causes two turns of Petrification, the Drillworm can stunlock up to two characters wthout Magic Armor.","l":1},{"p":"4. The Voidworm is immune to most forms of CC, but it can be turned into a chicken (though only for a single turn at a time, due to Walk It Off).","l":1},{"h":"#06: DALLIS FIGHT (LADY VENGEANCE)"},{"p":"- To gain maximum XP, you must beat Dallis's minions (all except one Monk) and make Dallis retreat with low health.","l":0},{"p":"- Since you have limited turns, you'll likely have to stack enemies and use AOE damage against them.","l":0},{"p":"- This is most reliably done with a character(s) with Ambidextrous trait: use all the grenades and scrolls you can spare here.","l":0},{"p":"1. Line up your characters' turns (by delaying them), then use Teleportation Scrolls to stack enemies together for 1AP and without cooldown.","l":1},{"p":"2. With a Physical damage party, use a combination of grenades (Armor-Piercing, Nailbomb) and AOE physical damage skills (Grasp of the Starved scroll, Corpse Explosion, etc.).","l":1},{"p":"3. With a Magical Party, craft and use scrolls for high-value, low-cost spells like Impalement and Winter Blast.","l":1},{"p":"- Once the minions are dealt with, you will have to get Dallis or the Cloaked Figure to low health: note they are both Undead.","l":0},{"p":"- Getting off a good Mass Corpse Explosion (PYR2 NEC2) will get Dallis to sufficiently low health, or close enough.","l":0},{"p":"- Alternatively, use Soul Mate (SUM2) on Dallis with a non-undead character and drink the highest-value health potions you have:","l":0},{"p":"Drinking 8 Healing Potions (or 2 Giant Healing Potions, if you craft them beforehand) will make Dalllis retreat from full health.","l":1},{"h":"#07: RYKER FIGHT"},{"p":"- This is not a difficult fight at Level 13, so long as you have a plan to burst down Ryker's armor (1403/1279) in the first round.","l":0},{"p":"- Note Ryker has 70% Water Resistance, but not much resistance otherwise.","l":0},{"p":"- Ryker has INI 32 and will likely go first; he can attack for 400+ damage and use Grasp of the Starved for 900+ damage, so consider giving a Glowing Idol to your squishiest member.","l":0},{"p":"- After Ryker's first turn, you should have enough time to get through his armor and stunlock him:","l":0},{"p":"1. Unload your offensive Source Skills on Ryker; most of them are pickpocketable from Hannag at any level.","l":1},{"p":"2. Bringing Adrenaline (SCO1) on everyone will likely ensure that you'll get through his armor in the first round.","l":1},{"p":"3. Crucially, the Bone Crawler that spawns each round has INI 37 and will knock Ryker off his turn priority, allowing your quickest character to act before Ryker every turn.","l":1},{"p":"- After getting through Ryker's armor, disable him (keeping in mind he has Walk It Off) with any form of CC and deal with his Masked Servants.","l":0},{"p":"- Whenever possible, use Source Vampirism to instantly kill a Masked Servant within range for just 1AP.","l":0},{"p":"- Use Spirit Vision before the battle, so you'll be able to see the Masked Servants' spirits; you can drain either the Spirits or the Servants, whichever is more convenient in battle.","l":0},{"p":"- Once Ryker is put under any form of CC, you should have no trouble keeping him disabled (as he has Perseverance 0).","l":0},{"p":"- Kill any remaining Masked Servants and manage turn delays + CC to whittle down Ryker without letting him act again.","l":0},{"h":"#08: LAMENTING ABOMINATION FIGHT"},{"p":"- You will have to fight the Lamenting Abomination and its 5 wolves; the wolves act last, so you will get several uninterrupted back-to-back turns.","l":0},{"p":"- The main threat in this fight is the Abomination, who starts with 8AP and recovers 7AP every round.","l":0},{"p":"- Perhaps surprisingly, the Abomination can (and often does) cast Teleportation, meaning it can one-turn-kill a soft target with Teleportation + 3 attacks on its opening turn.","l":0},{"p":"- Some points of note:","l":0},{"p":"1. The Abomination starts with INI 31; this number will almost certainly go up in battle, as it receives Void Howl from the Wolves (+5 WIT per stack).","l":1},{"p":"2. The Abomination's regualr attacks can set Knocked Down.","l":1},{"p":"3. The enemy wolves will (whenever possible) cast Void Howl, a stacking buff which gives the Abomination a +80% damage boost and +5 WIT, among other buffs.","l":1},{"p":"4. The Old Gray Wolf can cast Horrific Scream (though this isn't likely to be an issue, unless you are running Glass Cannon).","l":1},{"p":"- Some ideas:","l":0},{"p":"1. As the enemy strategy revolves entirely around stacking buffs on the Abomination, bursting down its armor and stunlocking it will shut down the threat completely.","l":1},{"p":"2. There's nothing to be gained from talking to the Abomination, so consider opening the fight from the ledge above for free attack and a high ground advantage.","l":1},{"p":"3. The Abomination has 60% Fire Resistance, but also -60% Earth Resistance and -50% Poison Resistance.","l":1},{"p":"4. Torturer + Worm Tremor is excellent here; adding on a Smoke Cover for yourself (for protection from Teleportation) will shut down the Abomination's first turn altogether.","l":1},{"p":"6. Be careful which CC you use, as the Abomination as Perseverance 6; Chicken Claw and Chloroform are good options, as always.","l":1},{"h":"#09: MAGISTERS VORRH AND REIMOND FIGHT"},{"p":"- While the fight itself isn't hard at Level 15, saving all three Black Ring prisoners for full XP requires some planning.","l":0},{"p":"- The main problem is Magister Vorrh, who will cast Mass Shackles of Pain as his first action; Teleporting him won't work, as it's scripted to bind the prisoners, ignoring distance.","l":0},{"p":"- The simplest way to deal with the fight is to burst down and disable Vorrh before he gets his turn; note he has 1942/410 armor, so this is considerably easier for a magic user.","l":0},{"p":"- Some ideas for maximizing damage on Vorrh:","l":0},{"p":"1. Vorrh and Reimond both have INI 25, so having INI 26+ will guarantee that at least one character will act before him (2, if you're lucky and Reimond acts before Vorrh).","l":1},{"p":"2. Adrenaline + Skin Graft + Adrenaline combo will give you a good deal of extra AP; you can use Elf Form (via Fane's Mask) to add Flesh Sacrifice to the mix.","l":1},{"p":"3. Smoking the Potent Ferocity Herbmix will let you start the fight with +2AP.","l":1},{"p":"4. Chicken Claw scroll costs 1AP to use, so you can save 1AP disabling him.","l":1},{"p":"5. If you initiate dialogue with Vorrh by jumping onto the nearby ledge with your Avatar, you can start the fight from high ground (see screenshots below).","l":1},{"p":"- If you opt (or are forced) to allow Vorrh to cast his Mass Shackles, you can use Cryogenic Stasis (HYD2) or Living On The Edge (NEC2) to try to keep the Prisoners alive.","l":0},{"p":"1. Keep in mind that this sometimes \"bugs\" the XP reward for the fight; check afterwards to make sure you've received the 11225XP.","l":1},{"p":"2. You can craft Living on the Edge scrolls (High Quality Shadow Essence + Raw Lumpy Giblets + Sheet of Paper) to avoid investing in Necromancer.","l":1},{"p":"- After you've killed Vorrh or dealt considerable damage to Reimond, Reimond will run away to his ship; let him escape, so you can fight him again later.","l":0},{"p":"- If you're inclined to cheese, you can always use the numerous corpses in the back room to set up for a Mass Corpse Explosion.","l":0},{"h":"#10: MOR THE TRENCHMOUTHED FIGHT"},{"p":"- This is a frustrating fight, as you'll be fighting your own party members for the most part.","l":0},{"p":"- For full XP, you must keep the Dwarven Adventurer alive and allow at least one party member to become possessed by Mor.","l":0},{"p":"- You'll be fighting just one enemy, Mor the Trenchmouthed; Mor itself isn't a damage threat, but it fights by possessing a nearby character whenever it receives damage.","l":0},{"p":"- While Mor is in possession of one of your characters, the character must take damage to be \"exorcised\"; between possessions you'll get a short window in which to attack Mor.","l":0},{"p":"- Some points of note:","l":0},{"p":"- There's no health threshold at which Mor is guaranteed to leave a character's body, though it will definitely leave if the character dies.","l":1},{"p":"- The possessed character will have access to your currently equipped skills.","l":1},{"p":"- It's recommended that you do something like the following (especially on Honour Mode):","l":0},{"p":"- Unequip weapons and offensive skills (including crowd-control skills) beforehand, so that your possessed character can't kill the Dwarven Adventurer or your other characters.","l":1},{"p":"- Have one character sit out (in a different zone, just to be safe) with all your potions and scrolls, so that your unpossessed characters can access them freely.","l":1},{"p":"- Don't bother attacking your possessed characters; the Dwarven Adventurer will do plenty of that on his own.","l":1},{"p":"- Instead, bring as many healing skills as you can and focus on healing & resurrecting your party members; save your (offensive) skill scrolls for when you can attack Mor directly.","l":1},{"p":"- Mor may or may not leave a corpse, depending on whether it manages to possess someone on death; this doesn't seem to affect XP or quest resolution.","l":0},{"h":"#11: WRECKER'S CAVE ENTRACE"},{"p":"- It's recommended you bring a high-INT character with Mass Corpse Explosion, but any character capable of dealing sufficiently high damage will work.","l":0},{"p":"- There are several enemies in the first zone, all of whom you can kill for XP.","l":0},{"p":"- The first is the Cold-Crawler Voidwoken near the entrance:","l":0},{"p":"1. Be careful about approaching it, as it will start running away if you get too close or attack it.","l":1},{"p":"2. Use the two nearby corpses as a guideline; try not to cross the imaginary line that connects them.","l":1},{"p":"3. In the screenshots below, a pile of three corpses is prepared (with an oil puddle to slow the Voidwoken, for good measure).","l":1},{"p":"4. The Voidwoken is then Teleported on top of the corpses and killed off with Mass Corpse Explosion.","l":1},{"p":"- The second enemy is the Quivering Dwarf to the northwest, who can be approached safely but who will also run off if attacked; kill her with a single attack as well.","l":0},{"p":"1. You can use two more nearby corpses (the now-dead Voidwoken, plus a Dwarf to the east) to get off another Mass Corpse Explosion.","l":1},{"p":"2. Alternatively, take advantage of her lack of Magic Armor and stunlock her.","l":1},{"p":"- The final enemies are the four voidwoken which ambush you in the north room:","l":0},{"p":"1. Go north and examine the body of the Dead Sourcerer.","l":1},{"p":"2. Backtrack slightly south to be ambushed by the Voidwoken.","l":1},{"p":"- The Voidwoken will (try to) drag your party members off out of combat; do not let them do this, as they will disappear forever.","l":0},{"p":"1. The Voidwoken use a special attack which deals high single-target Magic Damage and sets Frozen.","l":1},{"p":"2. The Storm-Wing Voidwoken have INI 21, so you should be able to go first (use skills like Peace of Mind to boost your WIT beforehand, if necessary).","l":1},{"p":"3. Keep a close eye on the turn order and kill or disable each one before it can act; at Level 16, this should be fairly manageable.","l":1},{"h":"#12: HANNAG FIGHT"},{"p":"- For full XP, you must let the Void Rifts expire on their own terms (as opposed to die from Burning Damage); whenever possible, try to kill enemies away from the Void Rifts.","l":0},{"p":"- It's a good idea to bring several Teleportation Scrolls and Teleport Volatile Voidlings below (as in the first screenshot below); this will prevent the portals from catching on fire.","l":0},{"p":"- You must also keep the Magister Knight alive through the fight. Some ideas:","l":0},{"p":"1. As enemies begin to spawn, Teleport the knight away (as far south as possible) to keep him out of the battle for as long as possible.","l":1},{"p":"2. Torturer + Worm Tremor will keep him fixed for three turns; Teleporting him on an oil surface will slow him down considerably as well.","l":1},{"p":"3. Make sure (by the fourth round) he is as far away from the battle as possible, so Hannag won't target him with her Lava Portal attack.","l":1},{"p":"4. The two Flayers (the final enemies to spawn) will prioritize the Knight with Void Glide + attacks, so bring some skills to bolster his armor.","l":1},{"p":"- Enemies will spawn according to the following script, provided you don't let the Void Rifts close prematurely:","l":0},{"p":"Round 1: Hannag will sacrifice herself, opening some Void Rifts and ending everyone's turn.","l":1},{"p":"Round 2: The Rifts will start spawning enemies: Volatile Voidling, Necro-Wing Voidwoken, Volatile Voidling.","l":1},{"p":"Round 3: Necro-Wing Voidwoken, Vampiric Voidwoken, Necro-Wing Voidwoken (explodes on death).","l":1},{"p":"Round 4: Necro-Wing Voidwoken, Necro-Wing Voidwoken, Necro-Wing Voidwoken, Volatile Voidling, Volatile Voidling; Hannag Reborn (casts Lava Portal).","l":1},{"p":"Round 5: Volatile Voidling, Vampiric Voidling.","l":1},{"p":"Round 6: Void Flayer, Aalbrck the Flayer.","l":1},{"p":"- At Level 17, there are only two big threats in this fight:","l":0},{"p":"1. The second Necro-Wing Voidwoken to spawn on Round 3, which explodes on death for massive (6000+) Fire Damage.","l":1},{"p":"2. Hannag Reborn, which will target one character with a (instant death) Lava Portal attack: note the attack works by creating a Lava surface beneath the target.","l":1},{"p":"- Having 100%+ Fire Resistance (possible with Flaming Skin (PYR 2 POL 2) or Five Star Diner + Fire Resistance Potions) will nullify both threats:","l":0},{"p":"1. Be careful, however, as Hannag will target the Magister Knight if everyone in your party has fire immunity.","l":1},{"p":"2. It's therefore recommended you keep the Magister Knight far away from the battle, or have a sacrificial character take Hannag's Lava attack.","l":1},{"p":"3. If you stole a Flaming Skin Scroll from Guardsman Stefano, this is a good place to use it.","l":1},{"h":"#13: ALICE ALISCEON FIGHT"},{"p":"- Be careful if on Honour Mode, as Alice is one of the highest-damage enemies relative to her level.","l":0},{"p":"- A few points of note:","l":0},{"p":"1. Alice has a debuff aura (Alice Alisceon's Pain) which inflicts 239-252 Piercing Damage every turn and gives -50% Fire Resistance.","l":1},{"p":"2. The debuff (along with high stats) makes it likely that she'll kill your entire party in one turn, if given the chance to act; note she has INI 47.","l":1},{"p":"3. Alice also has very high Resistances, except against Earth: Fire 160%, Water 50%, Air 50%, Poison 200% (Despite her Water Immunity Aura, she's not actually immune).","l":1},{"p":"4. She also has Retribution 10 (for 50% damage reflected), so you'll have to be mindful of dealing high damage to her.","l":1},{"p":"- As in the Lady Vengeance Dallis fight, the simplest way to beat Alice -- an Undead enemy -- is to use Soul Mate + Healing Potions:","l":0},{"p":"1. You can avoid having to respec by crafting a Soul Mate Scroll: High Quality Tormented Soul + Wheat + Piece of Paper.","l":1},{"p":"2. Any character quicker than Alice can kill her on the first turn by using Soul Mate on her and drinking 3 Giant Healing Potions, for just 4AP.","l":1},{"p":"- Otherwise, you will want to burst down and disable Alice before she can act:","l":0},{"p":"1. In the second screenshot below, Sebille (respecced to barely outspeed Alice at INI 48) casts Pyroclastic Eruption + Chloroform, which turns out to be enough to disable Alice.","l":1},{"p":"2. This makes the rest of the fight trivial, as Alice is squishy enough to be killed by the end of the first turn.","l":1},{"p":"3. With a Physical Damage character, something like Adrenaline + Jump skill + (Onslaught / Daggers Drawn / Arrow Storm) + Chicken Claw Scroll will probably work.","l":1},{"p":"4. A sufficiently high damage character (like a Necromancer) may be able to kill her outright with Adrenaline + Skin Graft combos -- though possibly at the cost of their own life.","l":1},{"p":"- A final (and far more complicated) way is to stack Fire Resistance on everyone and try to withstand Alice's Burning Anger attack.","l":0},{"p":"1. Note you will need 150% (and not 100%) Fire Resistance to completely negate her Fire damage, due to her aura.","l":1},{"p":"2. Five Star Diner + Large Fire Resistance Potion will get you to this point; Flaming Skin + Medium Fire Resistance Potion will also work.","l":1},{"p":"3. There isn't much strategy-wise, in this case; drink potions, engage her, withstand her first turn, and try to burst her down before she gets another.","l":1},{"h":"#14: JAHAN FIGHT"},{"p":"- Do this fight only if Lohse isn't in your party.","l":0},{"p":"- Note Jahan is the tankiest enemy yet (2489/5699 Armor, 9793 Vitality) with high resistances (Fire 80%; Water 80%; Air 60%; Earth 60%; Poison 40%), but also Perseverance 0.","l":0},{"p":"- Jahan has INI 68; you can bring this down to 57 by casting Peace of Mind on him and letting it expire.","l":0},{"p":"- This is still extremely high, but it is possible to outspeed him with a high-Polymorph, maxed WIT character (note almost every equipment slot can give some boost to WIT/INI).","l":0},{"p":"- One reliable way to beat Jahan is with Torturer + Worm Tremor, as shown below:","l":0},{"p":"1. Sebille (with maxed WIT) initiates combat and negates Jahan's first turn by teleporting him to low ground and applying Entangled status with Torturer + Worm Tremor.","l":1},{"p":"2. With Walk It Off, Jahan is immobilized for two turns -- and then two more, as Sebille reapplies Entangled with Skin Graft + Worm Tremor.","l":1},{"p":"3. With a Magical Damage composition, this turns out to be barely enough time to get through Jahan's Armor -- after which Jahan is kept stunned and whittled down.","l":1},{"p":"- Alternatively, you can use Five Star Diner to set up for the fight:","l":0},{"p":"1. Have everyone drink a Medium Resist All Potion (or higher) with Five Star Diner and enage Jahan in combat before the potion's effect runs out.","l":1},{"p":"2. The 100% elemental resistances will let you survive his first turn; note you'll still need some physical armor to survive his Teleportation, which can crit for 1500+ damage.","l":1},{"p":"3. Burst down Jahan before the potions' 3-turn duration runs out; you'll likely need a physical damage party for this.","l":1},{"p":"- Some points of note:","l":0},{"p":"1. Jahan uses defensive skills like Fortify, Restoration, and Arcane Stitch, but (apparently) not Armour of Frost.","l":1},{"p":"2. He can use Peace of Mind in battle (in case you overwrote it), so keep a close eye on the turn order.","l":1},{"h":"#15: THE ETERNAL AETERA FIGHT"},{"p":"- The enemy strategy revolves around using Aetera's high Initiative to freeze/stun everyone immediately with a Rain + Hail Storm or Rain + Chain Lightning combo.","l":0},{"p":"1. This combo deals considerable damage; she'll likely get through your armor (even at Level 17), if you offer her high ground.","l":1},{"p":"2. The Eternal Aetera has INI 41; it's highly recommended you bring someone quicker than her.","l":1},{"p":"3. The Aetera has high resistances (Water 40%, Air 80%, Poison 100%); she'll sometimes drink potions to boost her Fire and Earth Resistances (+75%) as well.","l":1},{"p":"4. She starts the fight with 4 Eternal Stalkers on her side; these aren't Soul-Bonded to her, but she'll summon two more (that are).","l":1},{"p":"- Some ideas:","l":0},{"p":"1. You can mitigate Aetera's AOE threat by spreading your characters out beforehand; there's no need for your entire party to stand next to the sarcophagus.","l":1},{"p":"2. The Stalkers have high resistances (including Poison Immunity), but only 42 Magic Armor; they're good targets for magic-based attacks.","l":1},{"p":"3. In the first screenshot below, Sebille uses Ignition to remove the Stalkers' Magic Armor and uses Mind Maggot Grenade's big radius to charm all four.","l":1},{"p":"4. Make full use of your Level 16 skills -- with a Magic Party, powerful ones like Mass Deploy Traps and Pyroclastic Eruption will likely take Aetera out before she can act.","l":1},{"h":"#16: THE SALLOW MAN FIGHT"},{"p":"- This fight should be manageable with Level 17-18 gear, so long as you don't allow the Sallow Man to get a second turn.","l":0},{"p":"- The Sallow Man will cast Plague every round on his turn, which is a stacking Damage debuff on your party and the primary threat in this fight.","l":0},{"p":"- As he has INI 64, you're unlikely to prevent him from getting off the first cast (-30% damage debuff); you should have no problem disabling him immediately afterwards, however.","l":0},{"p":"- Once you get through the Sallow Man's armor, keep him disabled and focus on the three Black Ring minions first, as he is scripted to resurrect after his first death.","l":0},{"p":"- Once The Sallow Man is killed, he'll be resurrected in the following round with 50% armor and health, as well as Enraged status; however, he won't act in the round he is resurrected.","l":0},{"p":"- Note First Aid (HUN1) will remove Plague, though this is not mentioned in the tooltip for either; bringing it on everyone is by far the best insurance against him.","l":0},{"h":"#17: BISHOP ALEXANDAR FIGHT (TEMPLE)"},{"p":"- For max XP, kill everyone except Alexandar and escape combat; you'll want to keep Alexandar alive, so you can turn in the Sallow Man quest and later Persuade him for XP.","l":0},{"p":"- The main problem is Alexandar himself, who provides Faith Aura to nearby allies and Resurrects dead ones.","l":0},{"p":"1. Note only the first kill gives XP, so the fight can't be farmed; escape as soon as you've killed each minion at least once.","l":1},{"p":"2. The skill works the same way as Resurrection Scrolls, meaning purged and exploded corpses can be resurrected just fine.","l":1},{"p":"- The simplest solution is to separate Alexandar by Teleporting him below, where he can't see his allies:","l":0},{"p":"- To ensure he never gets to use Resurrection on his allies, either fix him in place (with Enwebbed or Torturer + Worm Tremor) or chain Teleports to send him far below.","l":0},{"p":"- This will also prevent him from providing Faith Aura to his allies and hitting you with powerful spells like Closed Circuit.","l":0},{"p":"- Once Alexandar is \"taken care of,\" his minions shouldn't pose much of a problem; kill them and escape combat.","l":0},{"h":"#18: KILLING DALLIS'S MINIONS AT THE WELLSPRING"},{"p":"- This is one of the few cinematics in the game -- and the only one where you can kill enemies for XP.","l":0},{"p":"- As you won't have control over your characters during the cinematic, you'll have to cast a multi-round attack and immediately touch the Wellspring.","l":0},{"p":"- One way to do this is with Blood Storm or Thunderstorm -- you'll need a high-INT character to deal enough damage to kill everyone.","l":0},{"p":"- Upon getting your party to the Wellspring, get your character in position and stack as many (or as little) buffs as you need.","l":0},{"p":"- An example:","l":0},{"p":"1. Prepare beforehand by maxing INT and taking Savage Sortilege; having Five-Star Diner may help.","l":1},{"p":"2. Prepare beforehand by slotting as many runes as possible (Large Flame/Frost Rune of Power: +3 INT each).","l":1},{"p":"3. At the Wellspring, use some stat-boosting items: Large Intelligence Potion (+11 INT), Carrot (+4 WIT), Bedroll (+2 INT).","l":1},{"p":"4. Freeze the character in conversation and apply buffs: Peace of Mind (+5 INT/+10 WIT), Encourage (+3 INT).","l":1},{"p":"5. When ready, exit conversation and cast Blood Storm or Thunderstorm between the two rhombus tiles (as shown in the screenshot above) and touch the Wellspring.","l":1},{"p":"- If you're still short on damage, have multiple characters cast the spell at the same spot (as quickly as possible) before touching the Wellspring.","l":0},{"p":"- Killing the two Gheists and four Silent Watchers will net you 167400XP total.","l":0},{"h":"#19: SOURCE TITAN FIGHT"},{"p":"- There are two phases to this fight.","l":0},{"p":"- In the first phase, you will fight four embodiments of your god(s), assuming you brought four characters.","l":0},{"p":"- Your Avatar's god is scripted to go first, but it won't act on its first turn.","l":0},{"p":"- Each round, Lava Eruptions will fall on the ground, at random spots; the first strike on a given spot just deals fire damage, but the second creates Lava.","l":0},{"p":"- When three of the gods are killed and the fourth is brought to half health (or below), it will transform into a Source Titan, triggering the second phase:","l":0},{"p":"- The Source Titan will (usually, though not always) cast Pyroclastic Eruption on its first or second turn; this can result in a wipe, depending on your positioning.","l":0},{"p":"- Turn order is therefore important here, and works as follows:","l":0},{"p":"1. On transformation, the Source Titan will enter dialogue with a random nearby character.","l":1},{"p":"2. That character will be pushed to the beginning of the existing turn queue for that round, even if they've already acted; the Source Titan will be added right after.","l":1},{"p":"- Since the Source Titan phase is the only real threat, it's recommended you do something like the following, to be extra safe:","l":0},{"p":"1. In the first phase of the fight, kill three of the Gods but disable the fourth, leaving it at above half health (using Restoration, etc.).","l":1},{"p":"2. Take a round or two recovering your health and armors, keeping the God disabled.","l":1},{"p":"3. Spread your characters apart (at least 2m, enough not to take stacking damage from Pyroclastic Eruption).","l":1},{"p":"4. (Optional) Drink some Earth Resistance / Resist All Potions (Medium or greater) to mitigate the incoming damage.","l":1},{"p":"5. When ready, start a new round and trigger the transformation with your first character to act, so that the rest of your party have their actions remaining for that round.","l":1},{"p":"6. Continue the fight normally.","l":1},{"p":"- This should let you survive the Titan's first turn reliably -- kill it and make your way to Malady's beacon.","l":0},{"p":"- Some points of note:","l":0},{"p":"1. The Gods have Hovering status and the Source Titan is immune to Fire and Poison, so the Lava is a problem only for your characters.","l":1},{"p":"2. The Source Titan has the following Resistances: Fire 100%, Water 10%, Poison 100%, Physical 25%.","l":1},{"h":"#20: KILLING JUSTINIA'S GUARDS"},{"p":"- It's possible to kill all six guards for XP beore confronting Isbeil and Justinia; doing this will net you two extra kills, for 77600XP.","l":0},{"p":"- Begin by using Cloak and Dagger to jump as far west as you can; you'll need Far Out Man + Farsight to clear the archway and avoid triggering dialogue with Isbeil (see below).","l":0},{"p":"- Once across, bring in your other party members with Pyramids, but keep them unchained.","l":0},{"p":"- Use Teleportation to pick off guards one by one, starting with the two nearest ones:","l":0},{"p":"- Next, grab and kill the guard patrolling the zone entrance without going past the archway (see first screenshot below), then use Cloak and Dagger to return to the entrance.","l":0},{"p":"- Bring in your teammates again; make sure to use the Pyramids.","l":0},{"p":"- Afterwards, you should be able to pick off the remaining three guards.","l":0},{"h":"#21: LINDER KEMM FIGHT (REIMOND'S LAIR)"},{"p":"- For this fight, you must keep Linder Kemm alive and escape combat after killing all of his Paladins.","l":0},{"p":"- You'll be fighting ten enemies total: Kemm and six Paladins initially, plus the three Elite Paladins whom Kemm summons.","l":0},{"p":"1. Although you're heavily outnumbered, the regular Paladins are Level 18 and shouldn't much of a threat.","l":1},{"p":"2. Note the Elite Paladin Elementalist can use Resurrection, but this isn't a huge threat (as the resurrected enemies will be at low health).","l":1},{"p":"- Knowing the turn order in this fight will help you make the most of your first turn:","l":0},{"p":"1. The wand-wielding Paladin Elementalist has INI 30 and will be the first enemy to act; Kemm has INI 29 and will go second.","l":1},{"p":"2. At the end of Kemm's first turn, three Elite Paladins will be summoned at a random location on the map and will act last in that round.","l":1},{"p":"3. In the first screenshot below, Ifan has the third highest Initiative on the player team; this allows him to act after Kemm and target the tightly clumped Elite Paladins.","l":1},{"p":"- It's highly recommended you bring a character with Torturer + Worm Tremor to keep Kemm out of range as you kill the Paladins.","l":0},{"p":"- Otherwise, bring several Teleportation Scrolls, so you can keep Teleporting Kemm to low ground below; consider creating an Oil Puddle to keep Teleporting Kemm onto.","l":0},{"p":"Some ideas:","l":0},{"p":"1. Start the fight near the zone entrance, so you can get high ground advantage and easily escape combat if you're in a tight spot.","l":1},{"p":"2. This is one of the best places to burn through your Teleportation Scrolls; combine them with Ambidextrous Talent for maximum effect.","l":1},{"p":"3. Large-AOE skills (like Blood Storm or Thunderstorm) will help deal with the large number of enemies.","l":1},{"p":"4. Skills that benefit from enemy numbers -- like Pyroclastic Eruption and (Mass) Corpse Explosion -- can shine here.","l":1},{"h":"#22: KARON FIGHT"},{"p":"- This guide assumes you'll fight Karon in the Crypt, so that you can get a Talent point afterwards.","l":0},{"p":"- This is a good time to start optimizing your character builds and rotations, if you haven't been doing so up to this point:","l":0},{"p":"1. Enemy damage will only continue ramping up, to the point that you won't be able to meaningfully tank them even with your character/item level advantage.","l":1},{"p":"2. As such, your ability to act first and disable/kill the enemy in the first round will make or break most fights.","l":1},{"p":"3. Working in Adrenaline + Skin Graft into your rotation will help you squeeze as much AP as you can out of the first round.","l":1},{"p":"4. Consider keeping an emergency stash of Skin Graft Scrolls Lady Kemm's Green Tea, especially if on Honour Mode.","l":1},{"p":"5. Crafting other AP- and SP-saving tools -- like Teleportation Scrolls (with Ambidextrous Talent) and Apotheosis Scrolls -- will help yout considerably.","l":1},{"p":"6. Don't hesitate to use Virtue Tokens to recharge your Source Points in battle, as they don't cost any AP to use.","l":1},{"p":"- The main threat in this fight is Karon himself, who can deal considerable damage with his Geomancer and Pyrokinetic skills.","l":0},{"p":"- Karon has INI 60, so having a character quicker than him will give you a chance at disabling him before he can act:","l":0},{"p":"1. He has 2595/4454 armor, so this will be harder with a Magic Damage character; he also has high resistances (Fire 80%, Water 20%, Earth 80%, Poison 50%).","l":1},{"p":"2. In the next screenshot, Sebille manages to get through Karon's Magic Armor with Ambidextrous Talent and several Deep Freeze Scrolls.","l":1},{"p":"- Afterwards, kill Karon or keep him disabled and kill the rest of the enemies, keeping in mind they will use Dominate Mind whenever possible.","l":0},{"p":"- Spreading your Peace of Mind Scrolls among your characters' inventories is a good idea here (and in general).","l":1},{"p":"- Don't save and reload in the middle of the fight, as this will load a weaker version of Karon (who yields 0XP).","l":0},{"h":"#23: LUCIAN'S CRYPT PUZZLE"},{"p":"- Move your palm on the altar (Choice 2) to set the blocks.","l":0},{"p":"- Note you can turn several blocks at once.","l":0},{"p":"- Below is one solution (with the blocks you need to turn highlighted in yellow):","l":0},{"p":"- When finished turning the blocks, create a pool of blood over the nearby grating [69, 638] and Bless it.","l":0},{"p":"- Return to the altar and lay your hand (Choice 1) on it to set the surfaces in motion.","l":0},{"h":"#24: LOIC THE IMMACULATE FIGHT"},{"p":"- The main threats in the fight are Loic and the Necro-Wing Voidwoken.","l":0},{"p":"1. Loic can use Teleportation and Nether Swap to throw your characters into Deathfog.","l":1},{"p":"2. The Necro-Wing Voidwoken can create Deathfog with their ranged attacks.","l":1},{"p":"- Loic has INI 39, so it should be easy to outspeed him -- however, it may be tricky to get to him (note you'll need Far Out Man to reach him from the nearby boardwalk).","l":0},{"p":"- Enemy Resistances:","l":0},{"p":"1. Loic the Immaculate (Fire 170%, Air 50%, Poison 200%).","l":1},{"p":"2. Necro-Wing Voidwoken (Fire 100%, Poison -50%).","l":1},{"p":"3. Awakened Construct (Fire 20%, Water 50%, Earth 80%, Poison 200%).","l":1},{"p":"4. Volatile Voidling (Fire -50%, Water 20%, Earth 20%, Poison 40%).","l":1},{"p":"- It's recommended you do something like the following:","l":0},{"p":"1. Prepare some Deathfog Protection (Mass Breathing Bubbles), unless you're confident that you can disable Loic and the Necro-Wing Voidwoken on the first turn.","l":1},{"p":"2. Casting Tornado will clear of some of the Deathfog without triggering combat; see the first screenshot to get an idea of how close you can safely approach.","l":1},{"p":"3. There are some traps on the wooden boardwalks (as shown in the second screenshot), so be careful.","l":1},{"p":"4. It's recommended you use Ambidextrous + Teleportation Scrolls to grab and disable Loic and Necro-Wing Voidwoken on the very first turn, using Physical/Water/Earth damage.","l":1},{"p":"- Some points of note:","l":0},{"p":"1. Loic has Perseverence 4, so be mindful of which forms of CC you use.","l":1},{"p":"2. You can reach all three Necro-Wing Voidwoken from Loic's platform.","l":1},{"h":"#25: HORRORSLEEP ARENA FIGHT"},{"p":"- When you move away from your initial spot, Bishop Alexandar will appear and attack.","l":0},{"p":"- You'll initially fight Malady (INI 49), Windego (INI 49), and Bishop Alexandar (INI 48).","l":0},{"p":"- The enemies will keep respawning from the nearby Black Mirrors, so you have to kill all the enemies and the mirrors to end the fight.","l":0},{"p":"1. This is easily done at Level 21, but (to also kill the Horrorsleep Red Prince for XP) you'll need to keep the fight going until he spawns.","l":1},{"p":"2. Therefore, you'll want to keep the enemy disabled -- at least to the best of your ability, given that Alexandar has Perseverence 10 and Windego has Perseverance 4.","l":1},{"p":"- As with all fights where you have to keep characters alive, this is arguably most easily done with Torturer + Worm Tremor:","l":0},{"p":"1. In the example below, Sebille Teleports the enemies together and uses Torturer + Worm Tremor to hold them out of range.","l":1},{"p":"2. The remaining characters move to high ground, destroy the hard-to-reach mirrors, and wait for the Red Prince to spawn.","l":1},{"p":"- Once the Red Prince spawns, kill the remaining mirror(s) first and then kill the enemies.","l":0},{"p":"- Some points of note:","l":0},{"p":"1. It's possible to break the mirrors before talking to Alexandar, by standing in place and using such tools as Frost Grenades and Far Out Man + Sky Shot.","l":1},{"p":"2. Starting the fight this way (with just one mirror remaining) will make the fight a little more manageable.","l":1},{"h":"#26: CONTAMINATED HORROR FIGHT"},{"p":"- The Contaminated Horror receives a powerful buff from each of the three nearby Blooms:","l":0},{"p":"1. Bloom of Mettle (+75% to Fire, Water, Air, Earth, Physical Resistances).","l":1},{"p":"2. Bloom of Momentum (+3 Movement, +3 Start AP, +3 AP Recovery).","l":1},{"p":"3. Bloom of Might (+50% Damage).","l":1},{"p":"- Killing a Bloom will cause the corresponding buff to expire, though note each Bloom is immune to Earth and Poison.","l":0},{"p":"- For this fight, it's recommended that you focus on the Bloom of Mettle and take full advantage of the Contaminated Horror's low Initiative:","l":0},{"p":"1. With INI 27, the Contaminated Horror is tied for fourth place with Paladin Keene in the enemy turn order, after the Spiky Trunk and the two Hungry Flowers.","l":1},{"p":"2. This means that, so long as your fastest character outspeeds the Spiky Trunk (INI 44), all of your characters are guaranteed to act before the Contaminated Horror.","l":1},{"p":"3. In the first screenshot below, Sebille uses her first turn to kill the Bloom of Mettle and freeze the two Hungry Flowers in the process.","l":1},{"p":"4. As the Spiky Trunk is a non-threat, this gives the rest of the team uninterrupted back-to-back turns -- which turns out to be well enough to kill the Contaminated Horror outright.","l":1},{"p":"- A few points of note:","l":0},{"p":"1. Make sure you have damage sources other than Earth and Poison, as (even without the Bloom of Mettle) the Contaminated Horror has high Earth and Poison Resistances.","l":1},{"p":"2. The Contaminated Horror has the following resistances (naturally, without the Bloom of Mettle): Fire -20%, Water 25%, Earth 75%, Poison 100%.","l":1},{"p":"3. The Blooms can't be Teleported, so you'll have to stack the enemies on top of it, not the other way around.","l":1},{"p":"3. The Contaminated Horror itself can be Teleported, despite its size.","l":1},{"h":"#27: THE DEVOURER FIGHT"},{"p":"- Prepare for the fight by bringing as many crowd-control skills as possible (for use both against the Devourer and its minions):","l":0},{"p":"1. For Physical Damage parties, Chicken Claw works great, though keep in mind the Devourer has Walk It Off.","l":1},{"p":"2. For Magical Damage parties, Chloroform, as well as any Charm and Terrify skills & items, will work against the Devourer.","l":1},{"p":"3. Knocked Down, Frozen, and Stunned won't work on the Devourer for two turns after it's freed, but they work fine against his minions.","l":1},{"p":"- There are two phases to this fight.","l":0},{"p":"- During the first phase, the friendly spirits hold the Devourer down with Spirit Chains:","l":0},{"p":"1. The Devourer will not attack, though it will summon a Soulmarrow Cage (501 VIT) around one of your characters on its turn.","l":1},{"p":"2. The cage will prevent the trapped character from getting to act, so prioritize killing it first.","l":1},{"p":"- At some point in the fight, the Devourer will break free from the chains and start attacking your party:","l":0},{"p":"1. It can cast Flight and use Whirlwing (similar to Slane) every turn.","l":1},{"p":"2. It can use Rend Reality, which works exactly like Whirlwing but also creates two Reality Tears, which spawn more enemies.","l":1},{"p":"3. It can cast Necromancer skills like Grasp of the Starved, which will likely kill the targeted characters.","l":1},{"p":"- The fight will move into the second phase the moment any of the following three conditions are met:","l":0},{"p":"1. The Spirit of the Archeologist gets his turn in the third round (note he will be the only one left in his party, so this will occur near the very start of the round).","l":1},{"p":"2. Both of the Devourer's Minions are killed.","l":1},{"p":"3. You damage the Devourer to the point that its Physical or Magical Armor runs out.","l":1},{"p":"- Crucially, the Devourer can start attacking you on the turn it's freed, provided it hasn't acted yet.","l":0},{"p":"- Your strategy should revolve around exploiting the Devourer's freedom conditions, so that it never gets a turn:","l":0},{"p":"1. In the first screenshot above, Sebille uses her first turn to stack and disable the minions; note having Far Out Man lets her reach both enemies from the Devourer's spot.","l":1},{"p":"2. The remaining characters spend the first round killing one of the minions and keeping the other disabled at low health.","l":1},{"p":"3. When Round 2 comes around, the characters delay their turns as needed, so as to allow the Devourer to act.","l":1},{"p":"4. As soon as the Devourer's turn has passed, the characters start bursting down the Devourer and killing the remaining minion -- freeing the Devourer in the process.","l":1},{"p":"5. By the start of Round 3, the Devourer is free but without any Armor; this allows Sebille to disable it, and the rest of the team to finish it off.","l":1},{"p":"- Some points of note:","l":0},{"p":"1. Assuming you've been following the guide. your Avatar will be bound with just one turn of Shackles of Pain, so that you can start freely attacking on the second round.","l":1},{"p":"2. Otherwise, just give them a Glowing Idol and ignore the shackles altogether.","l":1},{"h":"#28: ADRAMAHLIHK FIGHT"},{"p":"- You'll be fighting Adramahlihk, its four Nemesis Demons, and the three nearby nurses (assuming you killed the other three beforehand).","l":0},{"p":"- If you made a pact with the Doctor, make sure to pickpocket your Blood Vial from him before the fight.","l":0},{"p":"- If Lohse is a companion, talk to him to initiate the fight; otherwise, get in position and attack the nearby nurse.","l":0},{"p":"- Barring one weird interaction involving Lohse, this fight is a straightforward DPS race.","l":0},{"p":"- The main threat in this fight is Adramahlihk, who has INI 10037; depending on whether Lohse is in your party, it will go first (Lohse) or second (No Lohse).","l":0},{"p":"- Its behavior will also depend on your party:","l":0},{"p":"1. If Lohse is in your party, it will not attack, but instead channel a spell which will take possession of Lohse forever on the next turn.","l":1},{"p":"2. If Lohse isn't in your party, it will attack with fire skills, such as Fireball and Epidemic of Fire: note it has 8 Starting AP and +8 AP Recovery.","l":1},{"p":"- Adramahlihk is extremely tanky, with 19905/22036 Armor and 10609 VIT; it also has fairy high Resistances (Fire 50%, Water 50%, Poison 20%).","l":0},{"p":"- Your priority should be disabling Adramahlihk as quickly as possible, killing or disabling the four Nemesis Demons in the process (if you can):","l":0},{"p":"1. Bring every AP-saving tool you can, especially Adrenaline and Skin Graft (scrolls).","l":1},{"p":"2. Use AP-saving scrolls like Teleportation Scrolls (with Ambidextrous Talent) and Apotheosis Scrolls to further save AP; Green Tea is always an option.","l":1},{"p":"3. Physical Damage parties should have no problem getting through Adramahlihk's armor, with high-damage skills like Onslaught, Arrow Spray, and Grasp of the Starved.","l":1},{"p":"4. With a Magic Damage party, Pyroclastic Eruption will do a ton of work; Mass Deploy Traps will also do considerable damage, despite Adramahlihk's Fire Resistance.","l":1},{"p":"- Some points of note:","l":0},{"p":"1. The four Nemesis Demons will join the fight at the end of the turn queue, so all of your characters will be able to act before them.","l":1},{"p":"2. Adramahlihk has Perseverance 6, so be mindful of which CC you use; it also has Retribution 4.","l":1},{"p":"3. Nurse La casts Geomancer skills and will try to sabotage your party with Throw Dust skill, so (other things being equal) prioritize her over the other nurses.","l":1},{"h":"#29: DJINN FIGHT"},{"p":"- You can do this fight wherever you like, including the Hall of Echoes; it's recommended you choose a small place, since the Djinn likes to Shade Shift around.","l":0},{"p":"- This fight is considerably easier than Adramahlihk, and only included here to point out several quirks:","l":0},{"p":"1. The Djinn uses physical attacks and water spells; unless you have fairly high Magic Armor (2500+), there's a danger of him freezing your entire party with Rain + Winter Blast.","l":1},{"p":"2. The Djinn is only moderately tanky (6751/9292 Armor, 10465 VIT), but it has high Resistances (Fire 30%, Water 200%, Air 30%, Earth -20, Poison 30%, Physical 50%).","l":1},{"p":"3. He also has Perseverance 10 and Retribution 5, so bring disabling skills not affected by Perseverance (Chicken Claw, Chloroform, Charm skills, etc.).","l":1},{"p":"- In the screenshot above, Sebille opens the fight by putting down a Firelamp and casting Fortify and Armour of Frost on vulnerable characters.","l":0},{"p":"- This allows everyone to survive the first turn fairly easily and disable the Djinn.","l":0},{"h":"#30: THE FINAL FIGHT"},{"p":"- You will be fighting Lucian and his minions; depending on how you deal with Vredeman, you will also have to fight Braccus Rex and the Kraken.","l":0},{"p":"- To maximize XP, you have to let Braccus Rex (Vredeman) reveal himself before killing him.","l":0},{"p":"- Prepare for a difficult fight:","l":0},{"p":"1. Bring lots of Green Tea, if you plan on using them.","l":1},{"p":"2. Bring First Aid on everyone who can use it, as you'll be fighting the Sallow Man.","l":1},{"p":"3. Bring as many Skin Graft Scrolls as you can craft: with sufficiently many (10+) Skin Graft Scrolls, this fight becomes trivial.","l":1},{"p":"4. Combining Ambidextrous Talent with various scrolls appropriate to your build (Tentacle Lash, Deep Freeze, etc.) will let you save some AP and ignore cooldowns.","l":1},{"p":"- In the first phase of the fight, you'll fight Lucian, Dallis, Vredeman, and their Magister allies.","l":0},{"p":"- The second phase will trigger when Dallis or Vredeman gets to very low (<20%) health:","l":0},{"p":"1. When the condition is met, Vredeman will reveal himself to be free and transform into Braccus Rex.","l":1},{"p":"2. Note it's possible to accidentally skip this event (and the second phase) by dealing high enough damage to Vredeman to kill him outright; this will result in less XP.","l":1},{"p":"- Your strategy should be to trigger the second phase as quickly as possible:","l":0},{"p":"1. Ignore Vredeman completely and focus on killing/disabling the others.","l":1},{"p":"2. Aside from the Gheist (which acts last), Lucian is the biggest damage threat: if at all possible, try to disable him before he can get his turn.","l":1},{"p":"3. Or, if you have enough damage (or Skin Graft scrolls), target Dallis to trigger the second phase immediately.","l":1},{"p":"4. In the first screenshot below, Sebille uses Ambidextrous + Teleportation Scrolls to stack Dallis with other enemies and casts Pyroclastic Eruption to trigger the second phase.","l":1},{"p":"- When the second phase begins, Braccus will reveal himself and move to high ground.","l":0},{"p":"1. The Kraken will be added to the front of the existing turn queue and will summon three Sworn enemies: Kemm, Isbeil, and the Sallow Man.","l":1},{"p":"2. The Sworn will act immediately afterwards; they won't do much (having to waste their AP walking toward you), but the Sallow Man will likely use Airborne Plague.","l":1},{"p":"- As the Kraken will keep respawning the Sworn, there is no point in fighting them off; killing Braccus will kill the others and give you full XP.","l":0},{"p":"1. Braccus Rex is not particularly tanky (10161/7599 Armor, 13170 VIT) and has unremarkable Resistances (Water 20%, Air 20%, Poison 200%).","l":1},{"p":"2. In the second screenshot below, Lohse uses First Aid to cleanse her Plague, then uses Deploy Mass Traps combo finish Braccus off quickly.","l":1},{"p":"- Some points of note:","l":0},{"p":"1. The fight will always start with your party in the same spot (shown in the first screenshot above); you'll be high enough to receive high ground bonus.","l":1},{"p":"2. Lucian and Dallis will tend to target Braccus's party, if they're standing in the second phase of the fight; Dallis will assume her Dragon Form.","l":1},{"p":"3. They are still enemies and will resume attacking you after Braccus is killed, so plan accordingly.","l":1},{"p":"4. Lucian has the following defensive stats: 9124/7599 Armor, 14452 VIT; Fire 30%, Water 50% Earth 20%, Poison 20% Resistances; Walk It Off Talent.","l":1},{"p":"5. Dallis has the following defensive stats: 6636/7220 Armor, 9082 VIT; Fire 50%, Water 40%, Air 70%, Earth 30%, Poison 200% Resistances.","l":1}]],["Reference",[{"h":"REFERENCE SHEET"},{"p":"- This page is intended to be a resource for quick reference during gameplay.","l":0},{"p":"- This is a work in progress, with more sections to be added in upcoming versions (and eventually to be separated into a companion file).","l":0},{"p":"[01] Default Class Stats at Level 2","l":0},{"p":"[02] Thievery Table","l":0},{"p":"[03] Act 1 Vendor List","l":0},{"p":"[04] Act 2 Vendor List","l":0},{"p":"[05] Act 3 Vendor List","l":0},{"p":"[06] Act 4 Vendor List","l":0},{"p":"[07] Vendor Stock Upgrades","l":0},{"p":"[08] Select Crafting Recipes","l":0},{"p":"[09] Select Generic Item Locations","l":0},{"p":"[10] Select Rune Effects","l":0},{"h":"[01] DEFAULT CLASS STATS AT LEVEL 2"},{"p":"- Use this table to decide your companions' initial classes.","l":0},{"p":"- All stats are at Level 2, when you're most likely to recruit companions.","l":0},{"p":"- Polymorph classes (Shadowblade, Metamorph) come \"missing\" the bonus stat point; use the Respec Mirror to fix this later.","l":0},{"t":[["Class","Attribute (Str / Fin / Int / Con / Mem / Wit)","Combat Ability","Talent","Skill","Civil Ability"],["Fighter","12 / 10 / 10 / 13 / 10 / 10","Geomancer (1)^Warfare (2)","Opportunist","Fortify^Battle Stomp^Bouncing Shield","Bartering (2)"],["Battlemage","12 / 10 / 12 / 11 / 10 / 10","Aerotheurge (1)^Warfare (2)","Comeback Kid","Shocking Touch^Blinding Radiance^Battering Ram" function renderTimeline(){
  const days={};let base=0,baseN=0;
  ORDER.forEach(o=>{const t=P.done[o.id];if(!t||!counted(o))return;if(t<1e6){base+=o.r[2];baseN++;return;}
    const d=new Date(t),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const e=days[k]||(days[k]={n:0,xp:0});e.n++;e.xp+=o.r[2];});
  const keys=Object.keys(days).sort();let cum=base;const pts=keys.map(k=>{cum+=days[k].xp;return{k,n:days[k].n,xp:days[k].xp,cum,lv:levelOf(cum)};});
  let h=`<h2>Run timeline</h2><div class="sub">XP and level by the day you ticked each step in “${esc(P.name)}”.</div>`;
  if(!pts.length){h+=`<p class="hint">No dated ticks yet. Steps you tick from now on are dated automatically.${baseN?` ${baseN} earlier tick${baseN===1?'':'s'} (${fmt(base)} XP) were made before the app recorded dates.`:''}</p>`;$('main').innerHTML=h;return;}
  const W=760,H=240,L=64,R=16,T=16,B=34,max=Math.max(pts[pts.length-1].cum,1),x=i=>L+(pts.length===1?(W-L-R)/2:i*(W-L-R)/(pts.length-1)),y=v=>T+(H-T-B)*(1-v/max);
  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative XP by day">`;
  [0,.5,1].forEach(f=>{svg+=`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)"/><text x="${L-8}" y="${y(max*f)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${fmt(Math.round(max*f))}</text>`;});
  svg+=`<polyline fill="none" stroke="var(--source)" stroke-width="2.5" points="${(base?[`${L},${y(base)}`]:[]).concat(pts.map((p,i)=>`${x(i)},${y(p.cum)}`)).join(' ')}"/>`;
  const step=Math.ceil(pts.length/10);
  pts.forEach((p,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(p.cum)}" r="4" fill="var(--source)"><title>${p.k}: ${fmt(p.cum)} XP, level ${p.lv}</title></circle>`;
    if(i%step===0||i===pts.length-1)svg+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="var(--mute)">${p.k.slice(5)}</text><text x="${x(i)}" y="${y(p.cum)-9}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">Lv ${p.lv}</text>`;});
  h+=`<div class="chart">${svg}</svg></div><div class="doc"><div class="tw"><table><tr><th>Day</th><th>Steps ticked</th><th>XP gained</th><th>Total XP</th><th>Level at end of day</th></tr>`;
  if(baseN)h+=`<tr><td>Before dates were recorded</td><td>${baseN}</td><td>${fmt(base)}</td><td>${fmt(base)}</td><td>${levelOf(base)}</td></tr>`;
  pts.forEach(p=>{h+=`<tr><td>${p.k}</td><td>${p.n}</td><td>${fmt(p.xp)}</td><td>${fmt(p.cum)}</td><td>${p.lv}</td></tr>`;});
  $('main').innerHTML=h+'</table></div></div>';
}

function ask(msg,opt={}){return new Promise(res=>{const d=$('dlg'),has=opt.input!==undefined;
  d.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p>${esc(msg)}</p>${has?(opt.area?`<textarea id="dlgIn" spellcheck="false">${esc(opt.input)}</textarea>`:`<input id="dlgIn" type="text" value="${esc(opt.input)}">`):''}<div class="btns">${opt.only?'':'<button data-ok="0">Cancel</button>'}<button data-ok="1" class="pri">${opt.ok||'OK'}</button></div></div>`;
  d.hidden=false;const inp=$('dlgIn');if(inp){inp.focus();inp.select();}else d.querySelector('.pri').focus();
  const done=v=>{d.hidden=true;d.onclick=d.onkeydown=null;res(v);};
  d.onclick=e=>{const b=e.target.closest('button');if(b)done(b.dataset.ok==='1'?(inp?inp.value:true):null);};
  d.onkeydown=e=>{if(e.key==='Escape')done(null);if(e.key==='Enter'&&inp&&inp.tagName==='INPUT')done(inp.value);};});}
function restoreFrom(text){try{const j=JSON.parse(text);let s;
    if(j.slot&&j.slot.done){s=Object.assign(newSlot('Restored'),j.slot);s.name=(j.slot.name||'Playthrough')+' (restored)';}
    else if(Array.isArray(j.done)){s=newSlot('Restored playthrough');j.done.forEach(id=>s.done[id]=1);}
    else throw 0;
    ['done','notes','skip','keep','jr','ach','sk'].forEach(k=>{if(!s[k])s[k]={};});if(!s.jadd)s.jadd=[];if(!s.comps)s.comps=[];
    const k='s'+Date.now();S.slots[k]=s;S.cur=k;P=s;save();render();}
  catch(err){toast('<b>That is not a progress backup from this checklist.</b>Nothing was changed.');}}
function toast(html){const t=$('toast');t.innerHTML=html+'<br><button>Got it</button>';t.hidden=false;t.querySelector('button').onclick=()=>t.hidden=true;}
function redrawRow(id,editing){const el=main.querySelector(`.row[data-id="${id}"]`);if(!el)return null;const tmp=document.createElement('div');tmp.innerHTML=rowHTML(ORDER[IDX[id]],editing);el.replaceWith(tmp.firstChild);return main.querySelector(`.row[data-id="${id}"]`);}
function refreshCounts(){
  renderSide();if(S.view[0]!=='p')return;const pi=+S.view.slice(1),sc=secCounts(pi);
  main.querySelector('.sub').textContent=subLine(pi);
  main.querySelectorAll('.sec').forEach(s=>{const c=sc[s.dataset.s]||[0,0];s.querySelector('header .c').textContent=c[0]+'/'+c[1];s.classList.toggle('alldone',!!c[1]&&c[0]===c[1]);});
}
const main=$('main');
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.view=b.dataset.v;S.q='';save();render();});
main.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='hd'){S.hideDone=t.checked;save();render(true);return;}
  if(t.id==='hs'){S.hideSkip=t.checked;save();render(true);return;}
  if(t.id==='ty'){S.type=t.value;save();render(true);return;}
  if(t.id==='af'){S.af=t.value;render(true);return;}
  if(t.dataset.ach){if(t.checked)P.ach[t.dataset.ach]=1;else delete P.ach[t.dataset.ach];save();if(S.view==='m')render(true);else{t.closest('label').classList.toggle('done',t.checked);renderSide();}return;}
  if(t.dataset.sk){if(t.checked)P.sk[t.dataset.sk]=1;else delete P.sk[t.dataset.sk];save();render(true);return;}
  if(t.dataset.j){const v=P.jr[t.dataset.j]||(P.jr[t.dataset.j]={});v.s=+t.value;save();t.closest('.jrow').className='jrow s'+v.s;renderSide();return;}
  if(t.dataset.jn!==undefined){const v=P.jr[t.dataset.jn]||(P.jr[t.dataset.jn]={});v.n=t.value;save();return;}
  if(t.dataset.keep){if(t.checked)P.keep[t.dataset.keep]=1;else delete P.keep[t.dataset.keep];t.closest('label').classList.toggle('done',t.checked);save();renderSide();return;}
  if(t.dataset.ch){if(!P.char)P.char={};P.char[t.dataset.ch]=t.type==='checkbox'?t.checked:t.value;save();$('charLow').innerHTML=charLow();return;}
  if(t.dataset.note!==undefined)return;
  const row=t.closest('.row');if(!row||t.type!=='checkbox')return;
  const before=levelOf(totals().xp);
  if(t.checked)P.done[row.dataset.id]=Date.now();else delete P.done[row.dataset.id];
  save();
  const after=levelOf(totals().xp);
  if(after>before){const hits=Object.keys(VEND).map(Number).filter(v=>v>before&&v<=after);
    toast(`<b>Level ${after} by your ticks.</b>`+(hits.length?'Vendors now stock: '+hits.map(v=>esc(VEND[v])).join('; ')+'. Worth a round of the traders.':'No new vendor tier at this level.'));}
  if(S.hideDone||['q','g','m','o'].includes(S.view)){render(true);return;}
  row.classList.toggle('done',t.checked);refreshCounts();
  if(S.view[0]==='p')main.querySelectorAll('.tag.check').forEach(el=>{const r=el.closest('.row');if(r)redrawRow(r.dataset.id);});
});
let qt;main.addEventListener('input',e=>{const c=e.target;if(c.dataset.ch&&c.type!=='checkbox'){if(!P.char)P.char={};P.char[c.dataset.ch]=c.value;save();$('charLow').innerHTML=charLow();return;}if(e.target.id!=='q')return;S.q=e.target.value;clearTimeout(qt);qt=setTimeout(()=>{render(true);const q=$('q');q.focus();q.setSelectionRange(q.value.length,q.value.length);},180);});
main.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.note!==undefined){const id=t.dataset.note,v=t.value.trim();if(v)P.notes[id]=v;else delete P.notes[id];save();redrawRow(id);}});
main.addEventListener('click',e=>{
  if(e.target.tagName==='TEXTAREA'){e.preventDefault();return;}
  const act=e.target.closest('.acts button');
  if(act){e.preventDefault();const row=act.closest('.row'),id=row.dataset.id;
    if(act.dataset.act==='note'){const el=redrawRow(id,true);const ta=el.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
    else{if(P.skip[id])delete P.skip[id];else P.skip[id]=1;save();if(S.hideSkip||['q','g','m','o'].includes(S.view)){render(true);}else{redrawRow(id);refreshCounts();}}
    return;}
  const ref=e.target.closest('.ref');
  if(ref){e.preventDefault();S.view='i2';save();render();const el=$('ref'+ref.dataset.ref.slice(1));if(el)el.scrollIntoView();return;}
  const tb=e.target.closest('.tabs button');if(tb){if(tb.dataset.gt!==undefined)S.gt=+tb.dataset.gt;else S.mg=+tb.dataset.mg;save();render(true);return;}
  if(e.target.id==='jgo'){const nm=$('jname').value.trim();if(nm){P.jadd.push([$('jact').value,nm]);save();render(true);}return;}
  const gt=e.target.closest('[data-goto]');if(gt){gotoRow(gt.dataset.goto);return;}
  const qh=e.target.closest('.sec[data-q]>header');if(qh){const qi=+qh.parentNode.dataset.q;S.qopen=S.qopen===qi?-1:qi;save();render(true);return;}
  const hd=e.target.closest('.sec>header');if(hd){const sec=hd.parentNode,k=sec.dataset.k;sec.classList.toggle('shut');if(sec.classList.contains('shut'))S.shut[k]=1;else delete S.shut[k];save();}
});
$('next').onclick=()=>{const n=nextUp();if(!n)return;S.view='p'+n.pi;S.q='';S.type='';S.hideSkip=false;delete S.shut[(n.pi+1)+'|'+n.r[6]];save();render();
  const el=main.querySelector(`.row[data-id="${n.id}"]`);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');}};
$('route').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;P.mercy=b.dataset.m==='1';save();render(true);});
$('party').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;P.party=b.dataset.p;const lim=P.party==='2'?1:P.party==='4'?3:0;P.comps=P.comps.slice(0,lim);save();render(true);});
$('mainSel').onchange=e=>{P.main=e.target.value;P.comps=P.comps.filter(n=>n!==P.main);save();render(true);};
$('comps').addEventListener('change',e=>{const c=e.target;if(!c.dataset.comp)return;const lim=P.party==='2'?1:3;
  if(c.checked){if(P.comps.length>=lim){c.checked=false;toast(`<b>Party is full.</b>${lim===1?'Two Lone Wolves means one partner. Untick the other first.':'A full party is you plus three. Untick someone first.'}`);return;}P.comps.push(c.dataset.comp);}
  else P.comps=P.comps.filter(n=>n!==c.dataset.comp);save();render(true);});
$('slot').onchange=e=>{S.cur=e.target.value;P=S.slots[S.cur];S.view='p0';save();render();};
$('sNew').onclick=async()=>{const name=await ask('Name for the new playthrough:',{input:'Playthrough '+(Object.keys(S.slots).length+1),ok:'Create'});if(!name)return;const k='s'+Date.now();S.slots[k]=newSlot(name.trim()||'Playthrough');S.slots[k].mercy=P.mercy;S.slots[k].party=P.party;S.slots[k].comps=P.comps.slice();S.slots[k].main=P.main;S.cur=k;P=S.slots[k];S.shut={};S.view='p0';save();render();};
$('sRen').onclick=async()=>{const name=await ask('Rename this playthrough:',{input:P.name,ok:'Rename'});if(name&&name.trim()){P.name=name.trim();save();renderSide();}};
$('sDel').onclick=async()=>{if(!await ask(`Delete “${P.name}” and all its ticks, notes and skips? This cannot be undone.`,{ok:'Delete'}))return;delete S.slots[S.cur];if(!Object.keys(S.slots).length)S.slots.a=newSlot('Playthrough 1');S.cur=Object.keys(S.slots)[0];P=S.slots[S.cur];S.view='p0';save();render();};
$('reset').onclick=async()=>{const n=Object.keys(P.done).length;if(await ask(`Untick all ${n} ticked steps in “${P.name}”? Your notes and skips stay. This cannot be undone; use “New” instead to keep this run.`,{ok:'Untick everything'})){P.done={};P.keep={};S.shut={};S.view='p0';save();render();}};
$('exp').onclick=()=>{
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:KEY,slot:P})],{type:'application/json'}));
  a.download='dos2-checklist-'+P.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.json';document.body.appendChild(a);a.click();a.remove();
};
$('imp').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>restoreFrom(rd.result);
  rd.readAsText(f);e.target.value='';
};
$('expT').onclick=()=>ask('Copy all of this text and keep it somewhere safe. It is your whole playthrough.',{input:JSON.stringify({app:KEY,slot:P}),area:true,only:true,ok:'Done'});
$('impT').onclick=async()=>{const v=await ask('Paste backup text here to restore it as a new playthrough:',{input:'',area:true,ok:'Restore'});if(v&&v.trim())restoreFrom(v);};
$('theme').onclick=()=>{
  const dark=S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  S.theme=dark?'light':'dark';document.documentElement.dataset.theme=S.theme;save();
};
load();if(S.theme)document.documentElement.dataset.theme=S.theme;
if(!['k','c','q','t','j','a','g','s','m','o'].includes(S.view)&&!(S.view[0]==='p'&&D.parts[+S.view.slice(1)])&&!(S.view[0]==='i'&&D.info[+S.view.slice(1)]))S.view='p0';
render();save();
</script>
</body>
</html>
